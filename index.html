<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#07111f">

<title>Afghani Coin</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:radial-gradient(circle at top,#173b5f,#07111f 48%,#030912);
    color:white;
    text-align:center;
    overflow-x:hidden;
}

.container{
    max-width:430px;
    margin:auto;
    padding:25px 18px 40px;
}

.logo{
    width:95px;
    height:95px;
    margin:5px auto 12px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:50px;
    font-weight:bold;
    color:#07111f;
    background:linear-gradient(145deg,#ffd700,#b77b00);
    box-shadow:0 0 20px rgba(255,215,0,.5),inset 0 0 12px rgba(255,255,255,.4);
}

.title{
    font-size:28px;
    font-weight:bold;
}

.subtitle{
    color:#a9b9c9;
    font-size:14px;
    margin:5px 0 22px;
}

.balance{
    font-size:42px;
    font-weight:bold;
}

.coin-name{
    color:#ffd700;
    margin:3px 0 22px;
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:25px;
}

.stat{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);
    border-radius:15px;
    padding:14px 8px;
}

.stat-name{
    color:#9eb0c1;
    font-size:12px;
    margin-bottom:6px;
}

.stat-value{
    font-size:22px;
    font-weight:bold;
}

/* MINE */

.mine-area{
    width:250px;
    height:250px;
    position:relative;
    margin:0 auto 20px;
}

.mine-button{
    position:absolute;
    left:15px;
    top:15px;
    width:220px;
    height:220px;
    padding:0;
    border:0;
    border-radius:50%;
    overflow:hidden;
    cursor:pointer;

    background:linear-gradient(
        90deg,
        #111 0%,
        #111 33.33%,
        #c8102e 33.33%,
        #c8102e 66.66%,
        #007a3d 66.66%,
        #007a3d 100%
    );

    box-shadow:
        0 13px 0 #533900,
        0 20px 35px rgba(0,0,0,.55),
        inset 0 5px 15px rgba(255,255,255,.3),
        inset 0 -10px 20px rgba(0,0,0,.3);

    display:flex;
    align-items:center;
    justify-content:center;
}

.mine-button:before{
    content:"";
    position:absolute;
    inset:7px;
    border-radius:50%;
    border:4px solid #ffd700;
    box-shadow:inset 0 0 8px rgba(255,255,255,.6),0 0 8px #ffd700;
    z-index:5;
}

.afghani-symbol{
    position:relative;
    z-index:6;
    width:105px;
    height:105px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:68px;
    font-weight:bold;
    color:#ffd700;
    background:rgba(0,0,0,.18);
    border:2px solid rgba(255,215,0,.6);
    text-shadow:0 3px 3px #000,0 0 10px #ffd700;
}

.mine-hit{
    animation:mineHit .22s ease;
}

@keyframes mineHit{
    0%{transform:scale(1) rotate(0)}
    50%{transform:scale(1.07) translateY(-8px) rotate(2deg)}
    100%{transform:scale(1) rotate(0)}
}

/* ENERGY */

.energy-box{
    margin:10px 0 25px;
}

.energy-text{
    display:flex;
    justify-content:space-between;
    color:#c8d5e0;
    font-size:14px;
    margin-bottom:7px;
}

.energy-bar{
    height:12px;
    background:#172536;
    border-radius:20px;
    overflow:hidden;
}

.energy-fill{
    height:100%;
    width:100%;
    background:linear-gradient(90deg,#00e5ff,#00ff88);
    border-radius:20px;
    transition:.3s;
}

/* BUTTONS */

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.action{
    border:1px solid #23445f;
    border-radius:13px;
    padding:15px 8px;
    background:#12263b;
    color:white;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.upgrade{
    background:linear-gradient(135deg,#a66b00,#e0a800);
    color:#07111f;
}

/* COIN ANIMATION */

.coin{
    position:fixed;
    pointer-events:none;
    z-index:9999;
    color:#ffd700;
    font-size:21px;
    font-weight:bold;
    text-shadow:0 0 8px #ffd700;
    animation:coinJump .85s ease-out forwards;
}

@keyframes coinJump{
    0%{
        transform:translate(0,0) scale(.5);
        opacity:0;
    }
    20%{
        opacity:1;
    }
    55%{
        transform:translate(var(--x),-100px) scale(1.2);
    }
    100%{
        transform:translate(var(--x2),-185px) scale(.9);
        opacity:0;
    }
}

/* STATUS */

.status{
    min-height:22px;
    margin-top:18px;
    color:#9eb0c1;
    font-size:13px;
}

/* WALLET */

.modal{
    position:fixed;
    inset:0;
    z-index:10000;
    background:rgba(0,0,0,.78);
    display:none;
    align-items:flex-end;
    justify-content:center;
    padding:0;
}

.modal.show{
    display:flex;
}

.wallet{
    width:100%;
    max-width:430px;
    max-height:88vh;
    overflow-y:auto;
    background:
        linear-gradient(180deg,#10263d,#07111f);
    border-radius:25px 25px 0 0;
    padding:22px 18px 30px;
    box-shadow:0 -10px 40px rgba(0,0,0,.5);
    text-align:center;
}

.wallet-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.wallet-title{
    font-size:24px;
    font-weight:bold;
}

.close{
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:#23384c;
    color:white;
    font-size:22px;
}

.wallet-card{
    border-radius:20px;
    padding:22px;
    background:
        linear-gradient(135deg,#111,#c8102e 50%,#007a3d);
    border:2px solid #ffd700;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    margin-bottom:15px;
}

.wallet-label{
    font-size:13px;
    opacity:.8;
}

.wallet-balance{
    font-size:38px;
    font-weight:bold;
    color:#ffd700;
    margin:7px 0;
}

.wallet-id{
    font-size:12px;
    word-break:break-all;
    background:rgba(0,0,0,.25);
    border-radius:10px;
    padding:10px;
    margin-top:12px;
}

.copy-btn{
    margin-top:8px;
    border:0;
    border-radius:10px;
    padding:9px 15px;
    background:#ffd700;
    color:#07111f;
    font-weight:bold;
}

.history-title{
    text-align:right;
    font-size:18px;
    font-weight:bold;
    margin:20px 0 10px;
}

.history{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.history-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.08);
    border-radius:12px;
    padding:12px;
}

.history-plus{
    color:#00ff88;
    font-weight:bold;
}

.history-time{
    color:#899aaa;
    font-size:11px;
    margin-top:4px;
}

.empty{
    color:#8fa1b2;
    padding:25px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">؋</div>

    <div class="title">
        Afghani Coin
    </div>

    <div class="subtitle">
        Mine AFC and build your balance
    </div>

    <div class="balance" id="balance">
        0
    </div>

    <div class="coin-name">
        AFC
    </div>

    <div class="stats">

        <div class="stat">
            <div class="stat-name">LEVEL</div>
            <div class="stat-value" id="level">1</div>
        </div>

        <div class="stat">
            <div class="stat-name">POWER</div>
            <div class="stat-value" id="power">1</div>
        </div>

    </div>

    <!-- MINE -->

    <div class="mine-area">

        <button
            id="mineButton"
            class="mine-button"
            onclick="mine()">

            <div class="afghani-symbol">
                ؋
            </div>

        </button>

    </div>

    <!-- ENERGY -->

    <div class="energy-box">

        <div class="energy-text">
            <span>⚡ Energy</span>
            <span id="energyText">100 / 100</span>
        </div>

        <div class="energy-bar">
            <div
                id="energyFill"
                class="energy-fill">
            </div>
        </div>

    </div>

    <!-- BUTTONS -->

    <div class="buttons">

        <button
            class="action"
            onclick="showMessage('Tasks coming soon 🚀')">
            📋 Tasks
        </button>

        <button
            class="action"
            onclick="showMessage('Invite system coming soon 👥')">
            👥 Invite
        </button>

        <button
            class="action"
            onclick="openWallet()">
            💰 Wallet
        </button>

        <button
            class="action upgrade"
            onclick="upgrade()">
            ⬆️ Upgrade
        </button>

    </div>

    <div
        id="status"
        class="status">
        Connecting...
    </div>

</div>


<!-- =========================
     WALLET MODAL
========================= -->

<div
    id="walletModal"
    class="modal"
    onclick="closeWalletOutside(event)">

    <div class="wallet">

        <div class="wallet-head">

            <div class="wallet-title">
                💰 AFC Wallet
            </div>

            <button
                class="close"
                onclick="closeWallet()">
                ×
            </button>

        </div>

        <div class="wallet-card">

            <div class="wallet-label">
                Available Balance
            </div>

            <div
                class="wallet-balance"
                id="walletBalance">
                0 AFC
            </div>

            <div class="wallet-label">
                Telegram Wallet ID
            </div>

            <div
                class="wallet-id"
                id="walletId">
                -
            </div>

            <button
                class="copy-btn"
                onclick="copyWalletId()">
                📋 Copy ID
            </button>

        </div>

        <div class="history-title">
            📊 Mining History
        </div>

        <div
            id="history"
            class="history">

            <div class="empty">
                Loading...
            </div>

        </div>

    </div>

</div>


<script>

/* =========================
   TELEGRAM
========================= */

const tg =
    window.Telegram.WebApp;

tg.ready();
tg.expand();


/* =========================
   API
========================= */

const API_BASE =
    "https://afghanicoin.vercel.app";


/* =========================
   TELEGRAM ID
========================= */

let telegramId =
    "123456789";

if(
    tg &&
    tg.initDataUnsafe &&
    tg.initDataUnsafe.user &&
    tg.initDataUnsafe.user.id
){
    telegramId =
        String(
            tg.initDataUnsafe.user.id
        );
}


/* =========================
   ELEMENTS
========================= */

const balanceEl =
    document.getElementById("balance");

const energyTextEl =
    document.getElementById("energyText");

const energyFillEl =
    document.getElementById("energyFill");

const levelEl =
    document.getElementById("level");

const powerEl =
    document.getElementById("power");

const mineButton =
    document.getElementById("mineButton");

const statusEl =
    document.getElementById("status");

const walletModal =
    document.getElementById("walletModal");

const walletBalance =
    document.getElementById("walletBalance");

const walletId =
    document.getElementById("walletId");

const historyEl =
    document.getElementById("history");


/* =========================
   USER
========================= */

let user = {
    balance:0,
    energy:100,
    level:1,
    power:1
};

let mining = false;


/* =========================
   SCREEN
========================= */

function updateScreen(){

    balanceEl.innerText =
        Number(user.balance || 0);

    energyTextEl.innerText =
        `${Number(user.energy || 0)} / 100`;

    levelEl.innerText =
        Number(user.level || 1);

    powerEl.innerText =
        Number(user.power || 1);

    let energy =
        Number(user.energy || 0);

    energy =
        Math.max(
            0,
            Math.min(100,energy)
        );

    energyFillEl.style.width =
        energy + "%";
}


/* =========================
   MESSAGE
========================= */

function showMessage(message){

    statusEl.innerText =
        message;

    setTimeout(() => {
        statusEl.innerText = "";
    },2500);
}


/* =========================
   LOAD USER
========================= */

async function loadUser(){

    try{

        const response =
            await fetch(
                `${API_BASE}/api/user?telegram_id=${encodeURIComponent(telegramId)}`,
                {
                    cache:"no-store"
                }
            );

        const data =
            await response.json();

        if(
            data.success &&
            data.user
        ){

            user =
                data.user;

            updateScreen();

            statusEl.innerText =
                "Connected ✓";

            setTimeout(() => {
                statusEl.innerText = "";
            },1200);

        }

    }catch(error){

        console.error(error);

        statusEl.innerText =
            "Connection error";
    }
}


/* =========================
   COIN ANIMATION
========================= */

function createCoin(){

    const coin =
        document.createElement("div");

    coin.className =
        "coin";

    const amount =
        Number(user.power || 1);

    coin.innerText =
        "+" + amount + " AFC";

    const rect =
        mineButton.getBoundingClientRect();

    coin.style.left =
        (
            rect.left +
            rect.width / 2 -
            25
        ) + "px";

    coin.style.top =
        (
            rect.top +
            rect.height / 2
        ) + "px";

    coin.style.setProperty(
        "--x",
        (Math.random()*100-50)+"px"
    );

    coin.style.setProperty(
        "--x2",
        (Math.random()*160-80)+"px"
    );

    document.body.appendChild(coin);

    setTimeout(() => {
        coin.remove();
    },900);
}


/* =========================
   SOUND
========================= */

let audioContext = null;

function playMineSound(){

    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();
        }

        if(
            audioContext.state ===
            "suspended"
        ){
            audioContext.resume();
        }

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type =
            "sine";

        oscillator.frequency.setValueAtTime(
            700,
            audioContext.currentTime
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            1200,
            audioContext.currentTime + .08
        );

        gain.gain.setValueAtTime(
            .0001,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .18,
            audioContext.currentTime + .01
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            audioContext.currentTime + .13
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime + .14
        );

    }catch(e){

        console.log(e);
    }
}


/* =========================
   MINE
========================= */

async function mine(){

    if(mining) return;

    if(
        Number(user.energy || 0) <= 0
    ){

        showMessage(
            "⚡ Energy تمام شده است"
        );

        return;
    }

    mining = true;

    mineButton.classList.add(
        "mine-hit"
    );

    playMineSound();
    createCoin();

    setTimeout(() => {

        mineButton.classList.remove(
            "mine-hit"
        );

    },250);

    try{

        const response =
            await fetch(
                `${API_BASE}/api/mine`,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        telegram_id:
                            telegramId
                    })
                }
            );

        const data =
            await response.json();

        if(
            data.success &&
            data.user
        ){

            user =
                data.user;

            updateScreen();

        }else{

            showMessage(
                data.message ||
                "Mining failed"
            );
        }

    }catch(error){

        console.error(error);

        showMessage(
            "خطا در استخراج"
        );

    }finally{

        mining = false;
    }
}


/* =========================
   UPGRADE
========================= */

async function upgrade(){

    try{

        const response =
            await fetch(
                `${API_BASE}/api/upgrade`,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        telegram_id:
                            telegramId
                    })
                }
            );

        const data =
            await response.json();

        if(
            data.success &&
            data.user
        ){

            user =
                data.user;

            updateScreen();

            showMessage(
                "Upgrade successful 🚀"
            );

        }else{

            showMessage(
                data.message ||
                "Upgrade failed"
            );
        }

    }catch(error){

        console.error(error);

        showMessage(
            "خطا در Upgrade"
        );
    }
}


/* =========================
   OPEN WALLET
========================= */

async function openWallet(){

    walletModal.classList.add(
        "show"
    );

    walletBalance.innerText =
        Number(user.balance || 0) +
        " AFC";

    walletId.innerText =
        telegramId;

    await loadHistory();
}


/* =========================
   CLOSE WALLET
========================= */

function closeWallet(){

    walletModal.classList.remove(
        "show"
    );
}

function closeWalletOutside(event){

    if(
        event.target ===
        walletModal
    ){
        closeWallet();
    }
}


/* =========================
   COPY WALLET ID
========================= */

async function copyWalletId(){

    try{

        await navigator.clipboard.writeText(
            telegramId
        );

        showMessage(
            "Wallet ID copied ✓"
        );

    }catch(e){

        showMessage(
            "Copy failed"
        );
    }
}


/* =========================
   MINING HISTORY
========================= */

async function loadHistory(){

    historyEl.innerHTML =
        `<div class="empty">
            Loading...
        </div>`;

    try{

        const response =
            await fetch(
                `${API_BASE}/api/mining-history?telegram_id=${encodeURIComponent(telegramId)}`,
                {
                    cache:"no-store"
                }
            );

        const data =
            await response.json();

        if(
            !data.success ||
            !Array.isArray(data.history)
        ){

            throw new Error(
                "History unavailable"
            );
        }

        if(
            data.history.length === 0
        ){

            historyEl.innerHTML =
                `<div class="empty">
                    هنوز استخراجی ثبت نشده است.
                </div>`;

            return;
        }

        historyEl.innerHTML = "";

        data.history.forEach(item => {

            const row =
                document.createElement("div");

            row.className =
                "history-item";

            const date =
                new Date(
                    item.created_at
                );

            row.innerHTML = `

                <div style="text-align:right">

                    <div>
                        ⛏️ Mining
                    </div>

                    <div class="history-time">
                        ${date.toLocaleString()}
                    </div>

                </div>

                <div class="history-plus">
                    +${Number(item.mined || 0)} AFC
                </div>
            `;

            historyEl.appendChild(row);

        });

    }catch(error){

        console.error(
            "HISTORY ERROR:",
            error
        );

        historyEl.innerHTML =
            `<div class="empty">
                تاریخچه فعلاً قابل دریافت نیست.
            </div>`;
    }
}


/* =========================
   START
========================= */

loadUser();


/* =========================
   REFRESH
========================= */

setInterval(() => {

    if(!mining){

        loadUser();

    }

},10000);

</script>

</body>
    </html>
