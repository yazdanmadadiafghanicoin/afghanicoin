<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Afghani Coin</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:18px;
  background:#071827;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

.logo{
  font-size:55px;
  margin-top:10px;
}

h1{
  margin:5px 0 20px;
}

.card{
  background:#123650;
  border-radius:22px;
  padding:20px;
  margin-bottom:20px;
}

.balance{
  font-size:38px;
  font-weight:bold;
  margin:10px;
}

.energy{
  font-size:18px;
  margin-top:10px;
}

.mine{
  width:180px;
  height:180px;
  border-radius:50%;
  border:5px solid #ffd54a;
  background:#ffb300;
  color:#111;
  font-size:24px;
  font-weight:bold;
  margin:15px auto 30px;
  display:block;
  cursor:pointer;
}

.mine:active{
  transform:scale(.95);
}

.mine:disabled{
  background:#666;
  border-color:#888;
  color:#ccc;
}

.menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.menu a{
  display:block;
  text-decoration:none;
  border-radius:17px;
  padding:20px 5px;
  background:#16496e;
  color:white;
  font-size:18px;
}

.panel{
  display:none;
  background:#123650;
  border-radius:20px;
  padding:20px;
  margin-top:18px;
}

.panel:target{
  display:block;
}

.panel h2{
  margin-top:0;
}

.panel button,
.panel a{
  display:block;
  width:100%;
  text-decoration:none;
  background:#ffb300;
  color:#111;
  padding:15px;
  margin-top:12px;
  border-radius:12px;
  font-weight:bold;
  border:0;
  font-size:16px;
}

.close{
  background:#526579!important;
  color:white!important;
}

.message{
  min-height:30px;
  margin:15px 0;
  font-weight:bold;
}

.small{
  color:#b9c7d3;
  font-size:14px;
}
</style>
</head>

<body>

<div class="logo">🪙</div>

<h1>Afghani Coin</h1>

<div class="card">

  <div>💰 موجودی شما</div>

  <div class="balance" id="balance">
    0 AFC
  </div>

  <div class="energy" id="energy">
    ⚡ انرژی: 100 / 100
  </div>

  <div class="small" id="level">
    Level: 1 | Power: 1
  </div>

</div>

<button
  class="mine"
  id="mineButton"
  onclick="mine()">

  ⛏️<br>
  MINE

</button>

<div class="message" id="message">
