<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">

<title>Afghani Coin</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at top,#173b5f 0%,#07111f 45%,#030912 100%);
    color:white;
    text-align:center;
    overflow-x:hidden;
}

.container{
    width:100%;
    max-width:430px;
    margin:auto;
    padding:25px 18px 40px;
}

.logo{
    width:95px;
    height:95px;
    margin:5px auto 12px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:60px;
    font-weight:bold;
    background:linear-gradient(145deg,#ffd700,#d99b00);
    color:#07111f;
    box-shadow:
        0 0 20px rgba(255,215,0,.5),
        inset 0 0 12px rgba(255,255,255,.4);
}

.title{
    font-size:28px;
    font-weight:bold;
    margin-bottom:4px;
}

.subtitle{
    color:#a9b9c9;
    font-size:14px;
    margin-bottom:22px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-bottom:25px;
}

.stat{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);
    border-radius:15px;
    padding:14px 8px;
}

.stat-name{
    color:#9eb0c1;
    font-size:12px;
    margin-bottom:6px;
}

.stat-value{
    font-size:22px;
    font-weight:bold;
}

.balance{
    font-size:42px;
    font-weight:bold;
    margin:10px 0 3px;
}

.coin-name{
    color:#ffd700;
    font-size:15px;
    margin-bottom:25px;
}

.mine-area{
    position:relative;
    width:240px;
    height:240px;
    margin:0 auto 25px;
}

.mine-button{
    position:absolute;
    left:20px;
    top:20px;
    width:200px;
    height:200px;
    border:none;
    border-radius:50%;
    cursor:pointer;

    background:
        radial-gradient(circle at 35% 30%,
        #fff3a0 0%,
        #ffd700 30%,
        #e5a900 65%,
        #9e6c00 100%);

    color:#07111f;
    font-size:95px;
    font-weight:bold;

    box-shadow:
        0 12px 0 #795300,
        0 20px 35px rgba(0,0,0,.5),
        inset 0 5px 10px rgba(255,255,255,.5);

    transition:.1s;
}

.mine-button:active{
    transform:translateY(10px);
    box-shadow:
        0 3px 0 #795300,
        0 10px 20px rgba(0,0,0,.4);
}

.mine-button.disabled{
    opacity:.45;
    cursor:not-allowed;
}

.energy-box{
    margin:10px 0 25px;
}

.energy-text{
    display:flex;
    justify-content:space-between;
    font-size:14px;
    margin-bottom:7px;
    color:#c8d5e0;
}

.energy-bar{
    width:100%;
    height:12px;
    background:#172536;
    border-radius:20px;
    overflow:hidden;
}

.energy-fill{
    height:100%;
    width:100%;
    background:linear-gradient(90deg,#00e5ff,#00ff88);
    border-radius:20px;
    transition:width .3s;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.action{
    border:none;
    border-radius:13px;
    padding:15px 8px;
    background:#12263b;
    color:white;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    border:1px solid #23445f;
}

.action:active{
    transform:scale(.97);
}

.upgrade{
    background:linear-gradient(135deg,#a66b00,#e0a800);
    color:#07111f;
}

.status{
    min-height:22px;
    margin-top:18px;
    color:#9eb0c1;
    font-size:13px;
}

.coin{
    position:fixed;
    pointer-events:none;
    z-index:9999;
    font-size:20px;
    font-weight:bold;
    color:#ffd700;
    text-shadow:0 0 8px #ffd700;

    animation:coinJump 900ms ease-out forwards;
}

@keyframes coinJump{
    0%{
        transform:translate(0,0) scale(.6);
        opacity:0;
    }

    15%{
        opacity:1;
        transform:translate(0,-20px) scale(1);
    }

    100%{
        transform:translate(
            var(--x),
            -170px
        ) scale(1.25);
        opacity:0;
    }
}

.flash{
    animation:flash .18s ease;
}

@keyframes flash{
    0%{transform:scale(1);}
    50%{transform:scale(1.08);}
    100%{transform:scale(1);}
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">؋</div>

    <div class="title">Afghani Coin</div>
    <div class="subtitle">Mine AFC and build your balance</div>

    <div class="balance" id="balance">0</div>
    <div class="coin-name">AFC</div>

    <div class="stats">

        <div class="stat">
            <div class="stat-name">LEVEL</div>
            <div class="stat-value" id="level">1</div>
        </div>

        <div class="stat">
            <div class="stat-name">POWER</div>
            <div class="stat-value" id="power">1</div>
        </div>

    </div>

    <div class="mine-area">
        <button
            id="mineButton"
            class="mine-button"
            onclick="mine()">
            ؋
        </button>
    </div>

    <div class="energy-box">

        <div class="energy-text">
            <span>⚡ Energy</span>
            <span id="energyText">100 / 100</span>
        </div>

        <div class="energy-bar">
            <div
                id="energyFill"
                class="energy-fill">
            </div>
        </div>

    </div>

    <div class="buttons">

        <button class="action" onclick="showMessage('Tasks coming soon 🚀')">
            📋 Tasks
        </button>

        <button class="action" onclick="showMessage('Invite system coming soon 👥')">
            👥 Invite
        </button>

        <button class="action" onclick="showMessage('Wallet coming soon 💰')">
            💰 Wallet
        </button>

        <button
            class="action upgrade"
            onclick="upgrade()">
            ⬆️ Upgrade
        </button>

    </div>

    <div
        id="status"
        class="status">
        Connecting...
    </div>

</div>

<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

/*
========================================
AFGHANI COIN API
========================================
*/

const API_BASE = "https://afghanicoin.vercel.app";

/*
Telegram user ID
*/

let telegramId = "123456789";

if(
    tg &&
    tg.initDataUnsafe &&
    tg.initDataUnsafe.user &&
    tg.initDataUnsafe.user.id
){
    telegramId =
        String(tg.initDataUnsafe.user.id);
}

/*
========================================
ELEMENTS
========================================
*/

const balanceEl =
    document.getElementById("balance");

const energyTextEl =
    document.getElementById("energyText");

const energyFillEl =
    document.getElementById("energyFill");

const levelEl =
    document.getElementById("level");

const powerEl =
    document.getElementById("power");

const mineButton =
    document.getElementById("mineButton");

const statusEl =
    document.getElementById("status");

/*
========================================
USER DATA
========================================
*/

let user = {
    balance:0,
    energy:100,
    level:1,
    power:1
};

let mining = false;

/*
========================================
SHOW STATUS
========================================
*/

function showMessage(message){

    statusEl.innerText = message;

    setTimeout(() => {

        statusEl.innerText = "";

    },3000);
}

/*
========================================
UPDATE SCREEN
========================================
*/

function updateScreen(){

    balanceEl.innerText =
        Number(user.balance || 0);

    energyTextEl.innerText =
        `${Number(user.energy || 0)} / 100`;

    levelEl.innerText =
        Number(user.level || 1);

    powerEl.innerText =
        Number(user.power || 1);

    let energy =
        Number(user.energy || 0);

    if(energy < 0){
        energy = 0;
    }

    if(energy > 100){
        energy = 100;
    }

    energyFillEl.style.width =
        energy + "%";

    if(energy <= 0){

        mineButton.classList.add("disabled");

    }else{

        mineButton.classList.remove("disabled");

    }
}

/*
========================================
LOAD USER
========================================
*/

async function loadUser(){

    try{

        const response = await fetch(
            `${API_BASE}/api/user?telegram_id=${encodeURIComponent(telegramId)}`,
            {
                method:"GET",
                cache:"no-store"
            }
        );

        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }

        const data =
            await response.json();

        if(
            data.success &&
            data.user
        ){

            user = data.user;

            updateScreen();

            statusEl.innerText =
                "Connected ✓";

            setTimeout(() => {

                statusEl.innerText = "";

            },2000);

        }else{

            throw new Error(
                data.message ||
                "User data error"
            );

        }

    }catch(error){

        console.error(
            "LOAD USER ERROR:",
            error
        );

        statusEl.innerText =
            "Connection error";

    }
}

/*
========================================
COIN ANIMATION
========================================
*/

function createCoin(){

    const coin =
        document.createElement("div");

    coin.className = "coin";

    coin.innerText =
        "+" + Number(user.power || 1) + " AFC";

    const rect =
        mineButton.getBoundingClientRect();

    coin.style.left =
        (rect.left + rect.width / 2 - 25) + "px";

    coin.style.top =
        (rect.top + rect.height / 2) + "px";

    const randomX =
        (Math.random() * 100 - 50) + "px";

    coin.style.setProperty(
        "--x",
        randomX
    );

    document.body.appendChild(coin);

    setTimeout(() => {

        coin.remove();

    },900);
}

/*
========================================
MINE
========================================
*/

async function mine(){

    if(mining){
        return;
    }

    if(
        !user ||
        Number(user.energy || 0) <= 0
    ){

        showMessage(
            "⚡ Energy تمام شده است"
        );

        return;
    }

    mining = true;

    mineButton.classList.add("flash");

    setTimeout(() => {

        mineButton.classList.remove("flash");

    },200);

    /*
    Show animation immediately
    */

    createCoin();

    try{

        const response =
            await fetch(
                `${API_BASE}/api/mine`,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        telegram_id:
                            telegramId

                    })
                }
            );

        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }

        const data =
            await response.json();

        console.log(
            "MINE RESPONSE:",
            data
        );

        if(
            data.success &&
            data.user
        ){

            user = data.user;

            updateScreen();

        }else{

            throw new Error(
                data.message ||
                "Mining failed"
            );

        }

    }catch(error){

        console.error(
            "MINE ERROR:",
            error
        );

        showMessage(
            "خطا در استخراج"
        );

    }finally{

        mining = false;

    }
}

/*
========================================
UPGRADE
========================================
*/

async function upgrade(){

    try{

        const response =
            await fetch(
                `${API_BASE}/api/upgrade`,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        telegram_id:
                            telegramId

                    })
                }
            );

        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }

        const data =
            await response.json();

        console.log(
            "UPGRADE RESPONSE:",
            data
        );

        if(
            data.success &&
            data.user
        ){

            user = data.user;

            updateScreen();

            showMessage(
                "Upgrade successful 🚀"
            );

        }else{

            showMessage(
                data.message ||
                "Upgrade failed"
            );

        }

    }catch(error){

        console.error(
            "UPGRADE ERROR:",
            error
        );

        showMessage(
            "خطا در Upgrade"
        );

    }
}

/*
========================================
AUTO LOAD
========================================
*/

loadUser();

/*
Refresh user every 10 seconds
*/

setInterval(() => {

    if(!mining){

        loadUser();

    }

},10000);

</script>

</body>
</html>
