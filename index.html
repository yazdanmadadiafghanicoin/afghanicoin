<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Afghani Coin</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #07111f, #102b45, #07111f);
    color: white;
    text-align: center;
    min-height: 100vh;
    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 500px;
    margin: auto;
    padding: 20px;
}

.logo {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(145deg, #ffd84d, #d99b00);
    color: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
    font-weight: bold;
    margin: 10px auto 15px;
    box-shadow: 0 0 30px rgba(255,210,60,0.5);
}

.title {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 5px;
}

.subtitle {
    opacity: 0.7;
    margin-bottom: 20px;
}

.balance-box {
    background: rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 15px;
    border: 1px solid rgba(255,255,255,0.1);
}

.balance {
    font-size: 42px;
    font-weight: bold;
}

.afc {
    font-size: 20px;
    opacity: 0.8;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 25px;
}

.stat {
    background: rgba(255,255,255,0.08);
    padding: 12px 5px;
    border-radius: 15px;
}

.stat-title {
    font-size: 13px;
    opacity: 0.7;
}

.stat-value {
    font-size: 20px;
    font-weight: bold;
    margin-top: 5px;
}

.mine-area {
    position: relative;
    height: 250px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.mine-button {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(145deg, #ffd84d, #d99b00);
    color: #111;
    font-size: 110px;
    font-weight: bold;
    cursor: pointer;
    box-shadow:
        0 15px 30px rgba(0,0,0,0.35),
        inset 0 5px 10px rgba(255,255,255,0.5);
    transition: transform 0.08s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

.mine-button:active {
    transform: scale(0.90);
}

.coin {
    position: absolute;
    font-size: 35px;
    font-weight: bold;
    color: #ffd84d;
    pointer-events: none;
    animation: coinJump 0.9s ease-out forwards;
}

@keyframes coinJump {
    0% {
        transform: translateY(0) scale(0.5);
        opacity: 0;
    }

    20% {
        opacity: 1;
        transform: translateY(-30px) scale(1);
    }

    100% {
        transform: translateY(-180px) scale(1.2);
        opacity: 0;
    }
}

.energy-bar {
    width: 100%;
    height: 15px;
    background: rgba(255,255,255,0.12);
    border-radius: 20px;
    overflow: hidden;
    margin-top: 15px;
}

.energy-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #ffd84d, #ffb300);
    transition: width 0.3s;
}

.energy-text {
    margin-top: 8px;
    font-size: 14px;
    opacity: 0.8;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 25px;
}

.action-button {
    border: none;
    border-radius: 15px;
    padding: 15px 10px;
    font-size: 16px;
    font-weight: bold;
    color: white;
    background: rgba(255,255,255,0.1);
    cursor: pointer;
}

.action-button:active {
    transform: scale(0.96);
}

.message {
    min-height: 25px;
    margin-top: 15px;
    font-size: 14px;
}

.loading {
    opacity: 0.5;
    pointer-events: none;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">؋</div>

    <div class="title">Afghani Coin</div>
    <div class="subtitle">Mine AFC and build your balance</div>

    <div class="balance-box">
        <div class="balance" id="balance">0</div>
        <div class="afc">AFC</div>
    </div>

    <div class="stats">

        <div class="stat">
            <div class="stat-title">Energy</div>
            <div class="stat-value" id="energy">100</div>
        </div>

        <div class="stat">
            <div class="stat-title">Level</div>
            <div class="stat-value" id="level">1</div>
        </div>

        <div class="stat">
            <div class="stat-title">Power</div>
            <div class="stat-value" id="power">1</div>
        </div>

    </div>

    <div class="mine-area" id="mineArea">

        <button
            id="mineButton"
            class="mine-button"
            onclick="mine()">
            ؋
        </button>

    </div>

    <div class="energy-bar">
        <div
            id="energyFill"
            class="energy-fill">
        </div>
    </div>

    <div class="energy-text">
        ⚡ Energy: <span id="energyText">100</span>/100
    </div>

    <div id="message" class="message"></div>

    <div class="buttons">

        <button class="action-button" onclick="tasks()">
            📋 Tasks
        </button>

        <button class="action-button" onclick="invite()">
            👥 Invite
        </button>

        <button class="action-button" onclick="wallet()">
            💰 Wallet
        </button>

        <button class="action-button" onclick="upgrade()">
            🚀 Upgrade
        </button>

    </div>

</div>

<script>

const tg = window.Telegram
    ? window.Telegram.WebApp
    : null;

if (tg) {
    tg.ready();
    tg.expand();
}

/* =========================
   TELEGRAM USER
========================= */

let telegramId = null;

if (
    tg &&
    tg.initDataUnsafe &&
    tg.initDataUnsafe.user &&
    tg.initDataUnsafe.user.id
) {
    telegramId = String(tg.initDataUnsafe.user.id);
}

/*
   برای تست خارج از تلگرام
*/
if (!telegramId) {
    telegramId = "123456789";
}

/* =========================
   GAME VARIABLES
========================= */

let balance = 0;
let energy = 100;
let level = 1;
let power = 1;

let loading = false;

const MAX_ENERGY = 100;

/* =========================
   UI
========================= */

function updateUI() {

    document.getElementById("balance").textContent =
        balance;

    document.getElementById("energy").textContent =
        energy;

    document.getElementById("energyText").textContent =
        energy;

    document.getElementById("level").textContent =
        level;

    document.getElementById("power").textContent =
        power;

    const percent =
        Math.max(0, Math.min(100, (energy / MAX_ENERGY) * 100));

    document.getElementById("energyFill").style.width =
        percent + "%";
}

/* =========================
   MESSAGE
========================= */

function showMessage(message) {

    const box =
        document.getElementById("message");

    box.textContent = message;

    setTimeout(() => {

        box.textContent = "";

    }, 2500);
}

/* =========================
   LOAD USER
========================= */

async function loadUser() {

    try {

        const response = await fetch(
            "/api/user?telegram_id=" +
            encodeURIComponent(telegramId)
        );

        const data = await response.json();

        console.log("USER RESPONSE:", data);

        if (!response.ok || !data.success) {

            showMessage(
                data.message || "خطا در دریافت اطلاعات"
            );

            return;
        }

        if (data.user) {

            balance =
                Number(data.user.balance);

            energy =
                Number(data.user.energy);

            level =
                Number(data.user.level);

            power =
                Number(data.user.power);

            updateUI();
        }

    } catch (error) {

        console.error(
            "Load user error:",
            error
        );

        showMessage(
            "خطا در اتصال به سرور"
        );
    }
}

/* =========================
   COIN ANIMATION
========================= */

function createCoin() {

    const area =
        document.getElementById("mineArea");

    const coin =
        document.createElement("div");

    coin.className = "coin";

    coin.textContent = "+1 AFC";

    coin.style.left =
        (45 + Math.random() * 10) + "%";

    coin.style.top =
        "50%";

    area.appendChild(coin);

    setTimeout(() => {

        coin.remove();

    }, 900);
}

/* =========================
   MINING
========================= */

async function mine() {

    if (loading) {
        return;
    }

    if (energy <= 0) {

        showMessage(
            "⚡ انرژی شما تمام شده است"
        );

        return;
    }

    loading = true;

    const button =
        document.getElementById("mineButton");

    button.classList.add("loading");

    /* انیمیشن سکه */

    createCoin();

    try {

        const response = await fetch(
            "/api/mine",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    telegram_id: telegramId
                })
            }
        );

        const data =
            await response.json();

        console.log(
            "MINE RESPONSE:",
            data
        );

        /* اگر API خطا داد */

        if (!response.ok || !data.success) {

            showMessage(
                data.message ||
                "استخراج انجام نشد"
            );

            return;
        }

        /*
           اطلاعات جدید را مستقیماً
           از دیتابیس می‌گیریم
        */

        if (data.user) {

            balance =
                Number(data.user.balance);

            energy =
                Number(data.user.energy);

            level =
                Number(data.user.level);

            power =
                Number(data.user.power);

            updateUI();

            showMessage(
                "+" +
                Number(data.mined || power) +
                " AFC ⛏️"
            );
        }

    } catch (error) {

        console.error(
            "Mining error:",
            error
        );

        showMessage(
            "خطا در اتصال به سرور"
        );

    } finally {

        loading = false;

        button.classList.remove(
            "loading"
        );
    }
}

/* =========================
   UPGRADE
========================= */

async function upgrade() {

    if (loading) {
        return;
    }

    loading = true;

    try {

        const response = await fetch(
            "/api/upgrade",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    telegram_id: telegramId
                })
            }
        );

        const data =
            await response.json();

        console.log(
            "UPGRADE RESPONSE:",
            data
        );

        if (!response.ok || !data.success) {

            showMessage(
                data.message ||
                "ارتقا انجام نشد"
            );

            return;
        }

        if (data.user) {

            balance =
                Number(data.user.balance);

            energy =
                Number(data.user.energy);

            level =
                Number(data.user.level);

            power =
                Number(data.user.power);

            updateUI();

            showMessage(
                "🚀 ارتقا موفق بود"
            );
        }

    } catch (error) {

        console.error(
            "Upgrade error:",
            error
        );

        showMessage(
            "خطا در اتصال به سرور"
        );

    } finally {

        loading = false;
    }
}

/* =========================
   OTHER BUTTONS
========================= */

function tasks() {

    showMessage(
        "📋 بخش Tasks به‌زودی فعال می‌شود"
    );
}

function invite() {

    showMessage(
        "👥 بخش Invite به‌زودی فعال می‌شود"
    );
}

function wallet() {

    showMessage(
        "💰 کیف پول به‌زودی فعال می‌شود"
    );
}

/* =========================
   AUTO REFRESH
========================= */

setInterval(
    loadUser,
    10000
);

/* =========================
   START
========================= */

updateUI();

loadUser();

</script>

</body>
</html>
