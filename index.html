<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Afghani Coin</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #071522;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .logo {
      font-size: 60px;
      margin-top: 30px;
    }

    h1 {
      font-size: 30px;
    }

    .card {
      background: #10283d;
      padding: 20px;
      margin: 15px 0;
      border-radius: 18px;
    }

    .balance {
      font-size: 35px;
      font-weight: bold;
    }

    .mine {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: none;
      background: #ffb300;
      font-size: 25px;
      font-weight: bold;
      margin: 25px;
    }

    .mine:disabled {
      background: #555;
      color: #aaa;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button.option {
      padding: 18px;
      border: none;
      border-radius: 15px;
      background: #153b59;
      color: white;
      font-size: 16px;
    }

    #message {
      margin-top: 20px;
      white-space: pre-line;
    }
  </style>
</head>

<body>

  <div class="logo">🪙</div>

  <h1>Afghani Coin</h1>

  <div class="card">

    <div>💰 موجودی</div>

    <div
      class="balance"
      id="balance"
    >
      0 AFC
    </div>

    <div id="energy">
      ⚡ انرژی: 0 / 100
    </div>

  </div>

  <button
    class="mine"
    id="mineButton"
    onclick="mine()"
    disabled
  >
    ⛏️
    <br>
    MINE
  </button>

  <div class="buttons">

    <button
      class="option"
      onclick="invite()"
    >
      👥
      <br>
      دعوت دوستان
    </button>

    <button
      class="option"
      onclick="tasks()"
    >
      🎁
      <br>
      Tasks
    </button>

    <button
      class="option"
      onclick="upgrade()"
    >
      🚀
      <br>
      Upgrade
    </button>

    <button
      class="option"
      onclick="wallet()"
    >
      👛
      <br>
      Wallet
    </button>

  </div>

  <div id="message">
    در حال اتصال...
  </div>


<script>

const tg =
  window.Telegram &&
  window.Telegram.WebApp;

if (tg) {
  tg.ready();
  tg.expand();
}

const API =
  "https://afghanicoin.vercel.app";

let telegramId = null;
let userData = null;


/* دریافت Telegram ID */

function getTelegramUser() {

  if (
    tg &&
    tg.initDataUnsafe &&
    tg.initDataUnsafe.user
  ) {

    return tg.initDataUnsafe.user;

  }

  return null;
}


/* پیام */

function message(text) {

  document.getElementById(
    "message"
  ).textContent = text;

}


/* دریافت حساب */

async function loadUser() {

  const user =
    getTelegramUser();


  if (
    !user ||
    !user.id
  ) {

    message(
      "⚠️ برنامه را از داخل ربات Telegram باز کنید."
    );

    return;
  }


  telegramId =
    String(user.id);


  try {

    const response =
      await fetch(
        API +
        "/api/user?telegram_id=" +
        encodeURIComponent(
          telegramId
        )
      );


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        data.message
      );

    }


    userData =
      data.user;


    updateUI();


    message(
      "✅ حساب آماده است"
    );


  } catch (error) {

    console.error(error);

    message(
      "❌ خطا در اتصال به حساب"
    );

  }

}


/* نمایش حساب */

function updateUI() {

  if (!userData) {
    return;
  }


  document.getElementById(
    "balance"
  ).textContent =
    Number(
      userData.balance || 0
    ) + " AFC";


  document.getElementById(
    "energy"
  ).textContent =
    "⚡ انرژی: " +
    Number(
      userData.energy || 0
    ) +
    " / 100";


  document.getElementById(
    "mineButton"
  ).disabled =
    Number(
      userData.energy || 0
    ) <= 0;

}


/* ماین */

async function mine() {

  if (!telegramId) {
    return;
  }


  try {

    const response =
      await fetch(
        API + "/api/mine",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            telegram_id:
              telegramId
          })
        }
      );


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        data.message
      );

    }


    userData =
      data.user;


    updateUI();


    message(
      "⛏️ +" +
      data.mined +
      " AFC"
    );


  } catch (error) {

    message(
      "❌ " +
      error.message
    );

  }

}


/* گزینه‌ها */

function invite() {

  message(
    "👥 بخش دعوت دوستان آماده می‌شود."
  );

}


function tasks() {

  message(
    "🎁 بخش Tasks آماده می‌شود."
  );

}


function upgrade() {

  message(
    "🚀 بخش Upgrade آماده می‌شود."
  );

}


function wallet() {

  message(
    "👛 بخش Wallet آماده می‌شود."
  );

}


/* شروع */

loadUser();

</script>

</body>
</html>
