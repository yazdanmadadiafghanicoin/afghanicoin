<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Afghani Coin</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      background:
        radial-gradient(circle at top, #183d58 0%, #07111f 45%, #030811 100%);
      overflow-x: hidden;
    }

    .app {
      width: 100%;
      max-width: 480px;
      margin: auto;
      padding: 20px 16px 30px;
    }

    .logo {
      width: 82px;
      height: 82px;
      margin: 5px auto 10px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;

      background: linear-gradient(145deg, #d4a72c, #8c6410);
      border: 4px solid #f4d56b;

      box-shadow:
        0 0 25px rgba(244, 213, 107, 0.35),
        inset 0 0 12px rgba(255,255,255,0.3);

      font-size: 48px;
      font-weight: bold;
      color: white;
    }

    h1 {
      margin: 5px 0 2px;
      font-size: 26px;
    }

    .subtitle {
      color: #a9c2d4;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .balance-card {
      padding: 18px;
      border-radius: 20px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      margin-bottom: 15px;
    }

    .balance-title {
      font-size: 13px;
      color: #a9c2d4;
    }

    .balance {
      font-size: 38px;
      font-weight: bold;
      margin-top: 5px;
    }

    .coin-name {
      font-size: 13px;
      color: #d4a72c;
      font-weight: bold;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat {
      padding: 13px 8px;
      border-radius: 15px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .stat-title {
      color: #9bb3c4;
      font-size: 12px;
      margin-bottom: 5px;
    }

    .stat-value {
      font-size: 19px;
      font-weight: bold;
    }

    .energy-wrap {
      margin: 10px 0 22px;
      text-align: right;
    }

    .energy-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 7px;
      font-size: 13px;
    }

    .energy-bar {
      width: 100%;
      height: 12px;
      background: #152536;
      border-radius: 20px;
      overflow: hidden;
    }

    .energy-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #27d3ff, #55f28b);
      border-radius: 20px;
      transition: width 0.3s ease;
    }

    .mine-area {
      position: relative;
      height: 260px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .mine-button {
      position: relative;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      border: 7px solid #d4a72c;
      background:
        radial-gradient(circle at 35% 30%, #ffe58a, #d4a72c 48%, #76520b);
      color: white;
      font-size: 100px;
      font-weight: bold;
      cursor: pointer;

      box-shadow:
        0 0 30px rgba(212,167,44,0.35),
        inset 0 0 25px rgba(255,255,255,0.25);

      transition:
        transform 0.08s ease,
        box-shadow 0.08s ease;
    }

    .mine-button:active {
      transform: scale(0.93);
      box-shadow:
        0 0 15px rgba(212,167,44,0.25),
        inset 0 0 30px rgba(0,0,0,0.25);
    }

    .mine-button.disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .coin {
      position: absolute;
      pointer-events: none;
      font-size: 28px;
      font-weight: bold;
      color: #f4d56b;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);

      animation: coinJump 0.9s ease-out forwards;
      z-index: 20;
    }

    @keyframes coinJump {
      0% {
        transform: translateY(0) scale(0.7) rotate(0deg);
        opacity: 0;
      }

      15% {
        opacity: 1;
      }

      100% {
        transform:
          translateY(-150px)
          translateX(var(--random-x))
          scale(1.15)
          rotate(20deg);
        opacity: 0;
      }
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 8px;
    }

    .action-btn {
      min-height: 52px;
      border: none;
      border-radius: 15px;
      color: white;
      font-size: 15px;
      font-weight: bold;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
    }

    .action-btn:active {
      transform: scale(0.97);
    }

    .upgrade {
      background: linear-gradient(135deg, #b78318, #e4bd45);
      color: #111;
    }

    .message {
      min-height: 22px;
      margin-top: 14px;
      font-size: 13px;
      color: #a9c2d4;
    }

    .footer {
      margin-top: 25px;
      color: #60788b;
      font-size: 11px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="logo">؋</div>

  <h1>Afghani Coin</h1>
  <div class="subtitle">Mine • Upgrade • Earn AFC</div>

  <div class="balance-card">
    <div class="balance-title">موجودی شما</div>

    <div class="balance" id="balance">
      0
    </div>

    <div class="coin-name">
      AFC
    </div>
  </div>

  <div class="stats">

    <div class="stat">
      <div class="stat-title">⚡ انرژی</div>
      <div class="stat-value" id="energy">
        100 / 100
      </div>
    </div>

    <div class="stat">
      <div class="stat-title">📈 سطح</div>
      <div class="stat-value" id="level">
        1
      </div>
    </div>

    <div class="stat">
      <div class="stat-title">⛏️ قدرت استخراج</div>
      <div class="stat-value" id="power">
        1
      </div>
    </div>

    <div class="stat">
      <div class="stat-title">💰 سکه</div>
      <div class="stat-value">
        AFC
      </div>
    </div>

  </div>

  <div class="energy-wrap">

    <div class="energy-top">
      <span>انرژی</span>
      <span id="energyText">100 / 100</span>
    </div>

    <div class="energy-bar">
      <div
        class="energy-fill"
        id="energyFill"
      ></div>
    </div>

  </div>

  <div class="mine-area" id="mineArea">

    <button
      class="mine-button"
      id="mineButton"
      onclick="mine()"
    >
      ؋
    </button>

  </div>

  <div class="buttons">

    <button
      class="action-btn"
      onclick="showTasks()"
    >
      🎯 Tasks
    </button>

    <button
      class="action-btn"
      onclick="inviteFriends()"
    >
      👥 Invite
    </button>

    <button
      class="action-btn"
      onclick="showWallet()"
    >
      💰 Wallet
    </button>

    <button
      class="action-btn upgrade"
      onclick="upgrade()"
    >
      🚀 Upgrade
    </button>

  </div>

  <div
    class="message"
    id="message"
  ></div>

  <div class="footer">
    Afghani Coin • AFC
  </div>

</div>


<script>

  // ==========================================
  // TELEGRAM
  // ==========================================

  const tg = window.Telegram
    ? window.Telegram.WebApp
    : null;

  if (tg) {
    tg.ready();
    tg.expand();
  }


  // ==========================================
  // USER
  // ==========================================

  let telegramId = null;

  if (
    tg &&
    tg.initDataUnsafe &&
    tg.initDataUnsafe.user
  ) {

    telegramId =
      String(tg.initDataUnsafe.user.id);

  }


  // برای تست خارج از تلگرام
  if (!telegramId) {

    telegramId = "123456789";

  }


  // ==========================================
  // VARIABLES
  // ==========================================

  const MAX_ENERGY = 100;

  let balance = 0;
  let energy = 100;
  let level = 1;
  let power = 1;

  let loading = false;


  // ==========================================
  // ELEMENTS
  // ==========================================

  const balanceEl =
    document.getElementById("balance");

  const energyEl =
    document.getElementById("energy");

  const energyTextEl =
    document.getElementById("energyText");

  const energyFillEl =
    document.getElementById("energyFill");

  const levelEl =
    document.getElementById("level");

  const powerEl =
    document.getElementById("power");

  const mineButton =
    document.getElementById("mineButton");

  const messageEl =
    document.getElementById("message");

  const mineArea =
    document.getElementById("mineArea");


  // ==========================================
  // UPDATE UI
  // ==========================================

  function updateUI() {

    balanceEl.textContent =
      Number(balance).toLocaleString();

    energyEl.textContent =
      `${energy} / ${MAX_ENERGY}`;

    energyTextEl.textContent =
      `${energy} / ${MAX_ENERGY}`;

    levelEl.textContent =
      level;

    powerEl.textContent =
      power;

    const percentage =
      Math.max(
        0,
        Math.min(
          100,
          (energy / MAX_ENERGY) * 100
        )
      );

    energyFillEl.style.width =
      percentage + "%";


    if (energy <= 0) {

      mineButton.classList.add(
        "disabled"
      );

    } else {

      mineButton.classList.remove(
        "disabled"
      );

    }

  }


  // ==========================================
  // MESSAGE
  // ==========================================

  function showMessage(text) {

    messageEl.textContent = text;

    setTimeout(() => {

      if (
        messageEl.textContent === text
      ) {
        messageEl.textContent = "";
      }

    }, 2500);

  }


  // ==========================================
  // LOAD USER
  // ==========================================

  async function loadUser() {

    try {

      const response = await fetch(
        `/api/user?telegram_id=${encodeURIComponent(telegramId)}`
      );

      const data =
        await response.json();


      if (
        data.success &&
        data.user
      ) {

        balance =
          Number(data.user.balance || 0);

        energy =
          Number(data.user.energy ?? 100);

        level =
          Number(data.user.level || 1);

        power =
          Number(data.user.power || 1);

        updateUI();

      } else {

        showMessage(
          "خطا در دریافت اطلاعات کاربر"
        );

      }

    } catch (error) {

      console.error(error);

      showMessage(
        "Failed to fetch"
      );

    }

  }


  // ==========================================
  // MINE
  // ==========================================

  async function mine() {

    if (loading) {
      return;
    }

    if (energy <= 0) {

      showMessage(
        "⚡ انرژی شما تمام شده است"
      );

      return;
    }


    loading = true;

    mineButton.classList.add(
      "disabled"
    );


    // انیمیشن سکه
    createCoinAnimation();


    try {

      const response = await fetch(
        "/api/mine",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            telegram_id:
              telegramId
          })
        }
      );


      const data =
        await response.json();


      if (
        data.success &&
        data.user
      ) {

        balance =
          Number(data.user.balance);

        energy =
          Number(data.user.energy);

        level =
          Number(data.user.level);

        power =
          Number(data.user.power);

        updateUI();

      } else {

        if (data.user) {

          balance =
            Number(data.user.balance);

          energy =
            Number(data.user.energy);

          level =
            Number(data.user.level);

          power =
            Number(data.user.power);

          updateUI();

        }

        showMessage(
          data.message ||
          "استخراج انجام نشد"
        );

      }

    } catch (error) {

      console.error(error);

      showMessage(
        "خطا در اتصال به سرور"
      );

    }


    loading = false;

    mineButton.classList.remove(
      "disabled"
    );

  }


  // ==========================================
  // COIN ANIMATION
  // ==========================================

  function createCoinAnimation() {

    const coin =
      document.createElement("div");

    coin.className =
      "coin";

    coin.textContent =
      "+" + power + " AFC";


    const randomX =
      (Math.random() * 100 - 50) +
      "px";

    coin.style.setProperty(
      "--random-x",
      randomX
    );


    const buttonRect =
      mineButton.getBoundingClientRect();

    const areaRect =
      mineArea.getBoundingClientRect();


    coin.style.left =
      (
        buttonRect.left -
        areaRect.left +
        buttonRect.width / 2 -
        25
      ) + "px";


    coin.style.top =
      (
        buttonRect.top -
        areaRect.top +
        buttonRect.height / 2
      ) + "px";


    mineArea.appendChild(
      coin
    );


    setTimeout(() => {

      coin.remove();

    }, 900);

  }


  // ==========================================
  // UPGRADE
  // ==========================================

  async function upgrade() {

    if (loading) {
      return;
    }


    const cost =
      level * 10;


    if (balance < cost) {

      showMessage(
        `برای ارتقا ${cost} AFC نیاز داری`
      );

      return;

    }


    loading = true;


    try {

      const response = await fetch(
        "/api/upgrade",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            telegram_id:
              telegramId
          })
        }
      );


      const data =
        await response.json();


      if (
        data.success &&
        data.user
      ) {

        balance =
          Number(data.user.balance);

        energy =
          Number(data.user.energy);

        level =
          Number(data.user.level);

        power =
          Number(data.user.power);

        updateUI();


        showMessage(
          "🚀 ارتقا با موفقیت انجام شد!"
        );

      } else {

        showMessage(
          data.message ||
          "ارتقا انجام نشد"
        );

      }

    } catch (error) {

      console.error(error);

      showMessage(
        "خطا در اتصال به سرور"
      );

    }


    loading = false;

  }


  // ==========================================
  // TASKS
  // ==========================================

  function showTasks() {

    showMessage(
      "🎯 بخش Tasks به‌زودی فعال می‌شود"
    );

  }


  // ==========================================
  // INVITE
  // ==========================================

  function inviteFriends() {

    if (!tg) {

      showMessage(
        "این بخش را از داخل تلگرام باز کن"
      );

      return;

    }


    const botUsername =
      "AfghaniCoinBot";


    const inviteLink =
      `https://t.me/${botUsername}?start=ref_${telegramId}`;


    const text =
      "⛏️ بیا Afghani Coin استخراج کنیم!";


    const shareUrl =
      `https://t.me/share/url?url=${encodeURIComponent(inviteLink)}&text=${encodeURIComponent(text)}`;


    tg.openTelegramLink(
      shareUrl
    );

  }


  // ==========================================
  // WALLET
  // ==========================================

  function showWallet() {

    showMessage(
      "💰 Wallet به‌زودی فعال می‌شود"
    );

  }


  // ==========================================
  // START
  // ==========================================

  updateUI();

  loadUser();


  // ==========================================
  // REFRESH USER
  // ==========================================

  setInterval(
    loadUser,
    10000
  );

</script>

</body>
  </html>
