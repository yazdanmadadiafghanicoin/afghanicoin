<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Afghani Coin</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #07111f, #102b45, #07111f);
    color: white;
    text-align: center;
    min-height: 100vh;
    overflow-x: hidden;
}

.container {
    max-width: 500px;
    margin: auto;
    padding: 20px;
}

.logo {
    width: 100px;
    height: 100px;
    margin: 10px auto 15px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, #ffd84d, #d99b00);
    color: #111;
    font-size: 60px;
    font-weight: bold;
    box-shadow: 0 0 30px rgba(255,210,60,.5);
}

.title {
    font-size: 28px;
    font-weight: bold;
}

.subtitle {
    opacity: .7;
    margin: 6px 0 20px;
}

.balance-box {
    background: rgba(255,255,255,.08);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 15px;
}

.balance {
    font-size: 42px;
    font-weight: bold;
}

.afc {
    font-size: 20px;
    opacity: .8;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 10px;
    margin-bottom: 20px;
}

.stat {
    background: rgba(255,255,255,.08);
    padding: 12px 5px;
    border-radius: 15px;
}

.stat-title {
    font-size: 13px;
    opacity: .7;
}

.stat-value {
    font-size: 20px;
    font-weight: bold;
    margin-top: 5px;
}

.mine-area {
    position: relative;
    height: 250px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.mine-button {
    width: 180px;
    height: 180px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(145deg,#ffd84d,#d99b00);
    color: #111;
    font-size: 110px;
    font-weight: bold;
    cursor: pointer;
    box-shadow:
        0 15px 30px rgba(0,0,0,.35),
        inset 0 5px 10px rgba(255,255,255,.5);
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

.mine-button:active {
    transform: scale(.90);
}

.mine-button.disabled {
    opacity: .5;
}

.coin {
    position: absolute;
    font-size: 32px;
    font-weight: bold;
    color: #ffd84d;
    pointer-events: none;
    animation: jump .9s ease-out forwards;
}

@keyframes jump {
    0% {
        transform: translateY(0) scale(.5);
        opacity: 0;
    }

    20% {
        opacity: 1;
        transform: translateY(-30px) scale(1);
    }

    100% {
        transform: translateY(-180px) scale(1.2);
        opacity: 0;
    }
}

.energy-bar {
    width: 100%;
    height: 15px;
    background: rgba(255,255,255,.12);
    border-radius: 20px;
    overflow: hidden;
    margin-top: 10px;
}

.energy-fill {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg,#ffd84d,#ffb300);
    transition: width .3s;
}

.energy-text {
    margin-top: 8px;
    opacity: .8;
}

.message {
    min-height: 25px;
    margin-top: 15px;
    font-size: 14px;
    line-height: 1.5;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 10px;
    margin-top: 20px;
}

.action-button {
    border: none;
    border-radius: 15px;
    padding: 15px 10px;
    font-size: 16px;
    font-weight: bold;
    color: white;
    background: rgba(255,255,255,.1);
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">؋</div>

    <div class="title">Afghani Coin</div>

    <div class="subtitle">
        Mine AFC and build your balance
    </div>

    <div class="balance-box">
        <div id="balance" class="balance">0</div>
        <div class="afc">AFC</div>
    </div>

    <div class="stats">

        <div class="stat">
            <div class="stat-title">Energy</div>
            <div id="energy" class="stat-value">100</div>
        </div>

        <div class="stat">
            <div class="stat-title">Level</div>
            <div id="level" class="stat-value">1</div>
        </div>

        <div class="stat">
            <div class="stat-title">Power</div>
            <div id="power" class="stat-value">1</div>
        </div>

    </div>

    <div id="mineArea" class="mine-area">

        <button
            id="mineButton"
            class="mine-button"
            onclick="mine()">
            ؋
        </button>

    </div>

    <div class="energy-bar">
        <div id="energyFill" class="energy-fill"></div>
    </div>

    <div class="energy-text">
        ⚡ Energy:
        <span id="energyText">100</span>/100
    </div>

    <div id="message" class="message"></div>

    <div class="buttons">

        <button class="action-button" onclick="tasks()">
            📋 Tasks
        </button>

        <button class="action-button" onclick="invite()">
            👥 Invite
        </button>

        <button class="action-button" onclick="wallet()">
            💰 Wallet
        </button>

        <button class="action-button" onclick="upgrade()">
            🚀 Upgrade
        </button>

    </div>

</div>

<script>

const tg =
    window.Telegram
        ? window.Telegram.WebApp
        : null;

if (tg) {
    tg.ready();
    tg.expand();
}

/* =========================
   TELEGRAM ID
========================= */

let telegramId = null;

if (
    tg &&
    tg.initDataUnsafe &&
    tg.initDataUnsafe.user &&
    tg.initDataUnsafe.user.id
) {
    telegramId =
        String(tg.initDataUnsafe.user.id);
}

/*
   فقط برای تست خارج از تلگرام
*/
if (!telegramId) {
    telegramId = "123456789";
}

/* =========================
   VARIABLES
========================= */

let balance = 0;
let energy = 100;
let level = 1;
let power = 1;

let loading = false;

const MAX_ENERGY = 100;

/* =========================
   UPDATE UI
========================= */

function updateUI() {

    document.getElementById("balance").textContent =
        balance;

    document.getElementById("energy").textContent =
        energy;

    document.getElementById("energyText").textContent =
        energy;

    document.getElementById("level").textContent =
        level;

    document.getElementById("power").textContent =
        power;

    const percent =
        Math.max(
            0,
            Math.min(
                100,
                (energy / MAX_ENERGY) * 100
            )
        );

    document.getElementById("energyFill").style.width =
        percent + "%";

    const button =
        document.getElementById("mineButton");

    if (energy <= 0) {
        button.classList.add("disabled");
    } else {
        button.classList.remove("disabled");
    }
}

/* =========================
   MESSAGE
========================= */

function showMessage(message) {

    document.getElementById("message").textContent =
        message;
}

/* =========================
   LOAD USER
========================= */

async function loadUser() {

    try {

        const response =
            await fetch(
                "/api/user?telegram_id=" +
                encodeURIComponent(telegramId)
            );

        const text =
            await response.text();

        let data;

        try {
            data = JSON.parse(text);
        } catch {
            showMessage(
                "پاسخ سرور JSON نیست: " +
                text.substring(0,150)
            );
            return;
        }

        console.log(
            "USER RESPONSE:",
            data
        );

        if (!response.ok || !data.success) {

            showMessage(
                "خطای User API: " +
                (data.message || response.status)
            );

            return;
        }

        if (data.user) {

            balance =
                Number(data.user.balance);

            energy =
                Number(data.user.energy);

            level =
                Number(data.user.level);

            power =
                Number(data.user.power);

            updateUI();
        }

    } catch (error) {

        console.error(
            "USER ERROR:",
            error
        );

        showMessage(
            "خطای اتصال User: " +
            error.message
        );
    }
}

/* =========================
   COIN ANIMATION
========================= */

function createCoin() {

    const area =
        document.getElementById("mineArea");

    const coin =
        document.createElement("div");

    coin.className = "coin";

    coin.textContent =
        "+" + power + " AFC";

    coin.style.left =
        (43 + Math.random() * 14) + "%";

    coin.style.top =
        "50%";

    area.appendChild(coin);

    setTimeout(() => {
        coin.remove();
    }, 900);
}

/* =========================
   MINE
========================= */

async function mine() {

    if (loading) {
        return;
    }

    if (energy <= 0) {

        showMessage(
            "⚡ انرژی شما تمام شده است"
        );

        return;
    }

    loading = true;

    const button =
        document.getElementById("mineButton");

    button.classList.add("disabled");

    createCoin();

    try {

        const response =
            await fetch(
                "/api/mine",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        telegram_id:
                            telegramId
                    })
                }
            );

        /*
           پاسخ را اول به صورت text می‌گیریم
           تا اگر Vercel HTML error داد،
           خطای واقعی را ببینیم.
        */

        const text =
            await response.text();

        console.log(
            "MINE STATUS:",
            response.status
        );

        console.log(
            "MINE RAW RESPONSE:",
            text
        );

        let data;

        try {

            data =
                JSON.parse(text);

        } catch {

            showMessage(
                "خطای سرور " +
                response.status +
                ": " +
                text.substring(0,200)
            );

            return;
        }

        console.log(
            "MINE RESPONSE:",
            data
        );

        /* API error */

        if (
            !response.ok ||
            !data.success
        ) {

            showMessage(
                "خطای استخراج: " +
                (
                    data.message ||
                    "HTTP " +
                    response.status
                )
            );

            return;
        }

        /* موفق */

        if (data.user) {

            balance =
                Number(data.user.balance);

            energy =
                Number(data.user.energy);

            level =
                Number(data.user.level);

            power =
                Number(data.user.power);

            updateUI();

            showMessage(
                "✅ +" +
                Number(data.mined || power) +
                " AFC ذخیره شد"
            );
        }

    } catch (error) {

        console.error(
            "MINE ERROR:",
            error
        );

        showMessage(
            "خطای اتصال Mine: " +
            error.message
        );

    } finally {

        loading = false;

        button.classList.remove(
            "disabled"
        );

        updateUI();
    }
}

/* =========================
   UPGRADE
========================= */

async function upgrade() {

    if (loading) {
        return;
    }

    loading = true;

    try {

        const response =
            await fetch(
                "/api/upgrade",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        telegram_id:
                            telegramId
                    })
                }
            );

        const text =
            await response.text();

        let data;

        try {
            data = JSON.parse(text);
        } catch {
            showMessage(
                "خطای سرور: " +
                text.substring(0,150)
            );
            return;
        }

        if (
            !response.ok ||
            !data.success
        ) {

            showMessage(
                data.message ||
                "Upgrade failed"
            );

            return;
        }

        if (data.user) {

            balance =
                Number(data.user.balance);

            energy =
                Number(data.user.energy);

            level =
                Number(data.user.level);

            power =
                Number(data.user.power);

            updateUI();

            showMessage(
                "🚀 ارتقا موفق بود"
            );
        }

    } catch (error) {

        showMessage(
            "خطای اتصال Upgrade: " +
            error.message
        );

    } finally {

        loading = false;
    }
}

/* =========================
   BUTTONS
========================= */

function tasks() {

    showMessage(
        "📋 Tasks به‌زودی فعال می‌شود"
    );
}

function invite() {

    showMessage(
        "👥 Invite به‌زودی فعال می‌شود"
    );
}

function wallet() {

    showMessage(
        "💰 Wallet به‌زودی فعال می‌شود"
    );
}

/* =========================
   AUTO REFRESH
========================= */

setInterval(
    loadUser,
    10000
);

/* =========================
   START
========================= */

updateUI();

loadUser();

</script>

</body>
    </html>
