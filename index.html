<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Afghani Coin</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
  margin:0;
  background:#10151c;
  color:white;
  font-family:Arial;
  text-align:center;
}

.container{
  max-width:430px;
  margin:auto;
  padding:25px 18px;
}

.logo{
  width:85px;
  height:85px;
  margin:auto;
  border-radius:50%;
  background:#6bd84f;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#102014;
  font-size:28px;
  font-weight:bold;
}

h1{
  margin-bottom:5px;
}

.card{
  margin-top:20px;
  background:#1a222c;
  padding:20px;
  border-radius:22px;
}

.balance{
  font-size:40px;
  font-weight:bold;
  margin:15px;
}

.rate{
  color:#79d85a;
}

.energy{
  margin-top:20px;
  text-align:left;
}

.energyTop{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
}

.bar{
  height:14px;
  background:#303b47;
  border-radius:20px;
}

.fill{
  height:14px;
  width:100%;
  background:#79d85a;
  border-radius:20px;
}

.mine{
  width:190px;
  height:190px;
  margin:25px auto;
  border:0;
  border-radius:50%;
  background:#63c94c;
  font-size:25px;
  font-weight:bold;
  cursor:pointer;
}

.mine:active{
  transform:scale(.94);
}

button{
  color:white;
}

.status{
  min-height:25px;
}

.reset{
  margin-top:15px;
  padding:12px 25px;
  border:0;
  border-radius:12px;
  background:#273442;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">AC</div>

  <h1>Afghani Coin</h1>

  <div>🪙 AFC Mining</div>

  <div class="card">

    <div>YOUR BALANCE</div>

    <div class="balance" id="balance">
      0 AFC
    </div>

    <div class="rate">
      👆 1 CLICK = +1 AFC
    </div>

    <div class="energy">

      <div class="energyTop">
        <span>⚡ ENERGY</span>
        <span id="energyText">100 / 100</span>
      </div>

      <div class="bar">
        <div class="fill" id="energyFill"></div>
      </div>

    </div>

    <button class="mine" id="mine">
      ⛏️ MINE
    </button>

    <div class="status" id="status">
      Tap MINE to earn AFC
    </div>

    <button class="reset" id="reset">
      🔄 Reset
    </button>

  </div>

</div>

<script>

let balance = Number(localStorage.getItem("afc_balance") || 0);
let energy = Number(localStorage.getItem("afc_energy") || 100);

const balanceElement = document.getElementById("balance");
const energyText = document.getElementById("energyText");
const energyFill = document.getElementById("energyFill");
const mineButton = document.getElementById("mine");
const status = document.getElementById("status");
const resetButton = document.getElementById("reset");

function update(){

  balanceElement.innerText =
    balance + " AFC";

  energyText.innerText =
    energy + " / 100";

  energyFill.style.width =
    energy + "%";

}

mineButton.addEventListener("click", function(){

  if(energy <= 0){

    status.innerText =
      "⚡ Energy is empty";

    return;
  }

  balance = balance + 1;

  energy = energy - 1;

  localStorage.setItem(
    "afc_balance",
    balance
  );

  localStorage.setItem(
    "afc_energy",
    energy
  );

  update();

  status.innerText =
    "+1 AFC 🪙";

});

resetButton.addEventListener("click", function(){

  balance = 0;

  energy = 100;

  localStorage.setItem("afc_balance", 0);
  localStorage.setItem("afc_energy", 100);

  update();

  status.innerText =
    "Reset complete";

});

setInterval(function(){

  if(energy < 100){

    energy = energy + 1;

    localStorage.setItem(
      "afc_energy",
      energy
    );

    update();

  }

},3000);

update();

</script>

</body>
</html>
