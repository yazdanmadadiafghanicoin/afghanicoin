<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Afghani Coin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#10151c;
  color:#fff;
  font-family:Arial,sans-serif;
}

.wrap{
  max-width:430px;
  margin:auto;
  padding:22px 18px 35px;
}

.top{text-align:center}

.logo{
  width:86px;
  height:86px;
  border-radius:50%;
  margin:auto;
  background:#79d85a;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  font-weight:800;
  color:#102014;
}

h1{
  margin:12px 0 4px;
  font-size:27px;
}

.sub{
  color:#91a0b0;
  font-size:14px;
}

.card{
  background:#1a222c;
  border-radius:22px;
  padding:20px;
  margin-top:20px;
  text-align:center;
}

.balance{
  font-size:42px;
  font-weight:800;
  margin:10px;
}

.rate{
  color:#79d85a;
  margin-bottom:15px;
}

.mine{
  width:190px;
  height:190px;
  border-radius:50%;
  border:0;
  margin:20px auto;
  background:linear-gradient(145deg,#8be667,#3a9e39);
  color:#071307;
  font-size:24px;
  font-weight:800;
  display:block;
  box-shadow:0 12px 35px #0008;
  cursor:pointer;
}

.mine:active{
  transform:scale(.94);
}

.row{
  display:flex;
  gap:10px;
  margin-top:14px;
}

.btn{
  flex:1;
  padding:14px;
  border:0;
  border-radius:13px;
  background:#273442;
  color:white;
  font-weight:700;
}

.note{
  font-size:12px;
  color:#7f8b98;
  margin-top:15px;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="top">
    <div class="logo">AC</div>
    <h1>Afghani Coin</h1>
    <div class="sub">AFC Mining</div>
  </div>

  <div class="card">

    <div class="sub">YOUR BALANCE</div>

    <div class="balance" id="balance">0 AFC</div>

    <div class="rate">
      👆 1 CLICK = +1 AFC
    </div>

    <button class="mine" id="mine">
      ⛏️ MINE
    </button>

    <div id="status" class="sub">
      Tap the button to mine AFC
    </div>

    <div class="row">
      <button class="btn" id="ref">
        👥 Invite
      </button>

      <button class="btn" id="reset">
        🔄 Reset
      </button>
    </div>

    <div class="note">
      Experimental click-mining version.
      AFC is currently an in-app demo balance.
    </div>

  </div>

</div>

<script>

const tg = window.Telegram?.WebApp;

if(tg){
  tg.ready();
  tg.expand();
}

/* ذخیره دائمی موجودی در همین دستگاه */
let balance = Number(
  localStorage.getItem("afc_balance") || 0
);

const balanceEl = document.getElementById("balance");
const statusEl = document.getElementById("status");
const mineBtn = document.getElementById("mine");
const resetBtn = document.getElementById("reset");

function render(){

  balanceEl.textContent =
    balance.toLocaleString() + " AFC";

}

mineBtn.onclick = function(){

  balance += 1;

  localStorage.setItem(
    "afc_balance",
    balance
  );

  render();

  statusEl.textContent =
    "+1 AFC added 👆🪙";

};

resetBtn.onclick = function(){

  balance = 0;

  localStorage.setItem(
    "afc_balance",
    balance
  );

  render();

  statusEl.textContent =
    "Demo balance reset";

};

render();

</script>

</body>
</html>
