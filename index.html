<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">

<title>Afghani Coin</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at top,#173b5f 0%,#07111f 45%,#030912 100%);
    color:white;
    text-align:center;
    overflow-x:hidden;
}

.container{
    width:100%;
    max-width:430px;
    margin:auto;
    padding:25px 18px 40px;
}

.logo{
    width:95px;
    height:95px;
    margin:5px auto 12px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:50px;
    font-weight:bold;
    background:linear-gradient(145deg,#ffd700,#b77b00);
    color:#07111f;
    box-shadow:
        0 0 20px rgba(255,215,0,.5),
        inset 0 0 12px rgba(255,255,255,.4);
}

.title{
    font-size:28px;
    font-weight:bold;
    margin-bottom:4px;
}

.subtitle{
    color:#a9b9c9;
    font-size:14px;
    margin-bottom:22px;
}

.balance{
    font-size:42px;
    font-weight:bold;
    margin:10px 0 3px;
}

.coin-name{
    color:#ffd700;
    font-size:15px;
    margin-bottom:22px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-bottom:25px;
}

.stat{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);
    border-radius:15px;
    padding:14px 8px;
}

.stat-name{
    color:#9eb0c1;
    font-size:12px;
    margin-bottom:6px;
}

.stat-value{
    font-size:22px;
    font-weight:bold;
}

/* =========================
   MINE AREA
========================= */

.mine-area{
    position:relative;
    width:250px;
    height:250px;
    margin:0 auto 20px;
}

.mine-button{
    position:absolute;
    left:15px;
    top:15px;

    width:220px;
    height:220px;

    border:none;
    border-radius:50%;

    cursor:pointer;

    background:
        radial-gradient(
            circle at 35% 25%,
            #fff6b0 0%,
            #ffd700 25%,
            #e2a900 65%,
            #815700 100%
        );

    box-shadow:
        0 13px 0 #664500,
        0 20px 35px rgba(0,0,0,.55),
        inset 0 5px 12px rgba(255,255,255,.5);

    display:flex;
    align-items:center;
    justify-content:center;

    transition:.1s;
}

.mine-button:active{
    transform:translateY(9px);

    box-shadow:
        0 4px 0 #664500,
        0 10px 20px rgba(0,0,0,.4);
}

.mine-button.disabled{
    opacity:.45;
    cursor:not-allowed;
}

/* Afghanistan SVG */

.afghanistan{
    width:175px;
    height:175px;

    filter:
        drop-shadow(0 5px 4px rgba(0,0,0,.45));
}

/* shine */

.mine-shine{
    position:absolute;
    top:31px;
    left:42px;

    width:55px;
    height:25px;

    border-radius:50%;

    background:rgba(255,255,255,.3);

    transform:rotate(-25deg);

    pointer-events:none;
}

/* =========================
   ENERGY
========================= */

.energy-box{
    margin:10px 0 25px;
}

.energy-text{
    display:flex;
    justify-content:space-between;

    font-size:14px;

    margin-bottom:7px;

    color:#c8d5e0;
}

.energy-bar{
    width:100%;
    height:12px;

    background:#172536;

    border-radius:20px;

    overflow:hidden;
}

.energy-fill{
    height:100%;
    width:100%;

    background:
        linear-gradient(
            90deg,
            #00e5ff,
            #00ff88
        );

    border-radius:20px;

    transition:width .3s;
}

/* =========================
   BUTTONS
========================= */

.buttons{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.action{
    border:none;

    border-radius:13px;

    padding:15px 8px;

    background:#12263b;

    color:white;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

    border:1px solid #23445f;
}

.action:active{
    transform:scale(.97);
}

.upgrade{
    background:
        linear-gradient(
            135deg,
            #a66b00,
            #e0a800
        );

    color:#07111f;
}

/* =========================
   STATUS
========================= */

.status{
    min-height:22px;

    margin-top:18px;

    color:#9eb0c1;

    font-size:13px;
}

/* =========================
   COIN JUMP
========================= */

.coin{
    position:fixed;

    pointer-events:none;

    z-index:9999;

    font-size:20px;

    font-weight:bold;

    color:#ffd700;

    text-shadow:
        0 0 8px #ffd700,
        0 0 15px rgba(255,215,0,.5);

    animation:
        coinJump .85s ease-out forwards;
}

@keyframes coinJump{

    0%{
        transform:
            translate(0,0)
            scale(.5)
            rotate(0deg);

        opacity:0;
    }

    15%{
        opacity:1;

        transform:
            translate(0,-25px)
            scale(1.1)
            rotate(-8deg);
    }

    50%{

        transform:
            translate(
                var(--x),
                -100px
            )
            scale(1.25)
            rotate(8deg);
    }

    100%{

        transform:
            translate(
                var(--x2),
                -185px
            )
            scale(.9)
            rotate(20deg);

        opacity:0;
    }
}

/* button animation */

.mine-hit{
    animation:
        mineHit .18s ease;
}

@keyframes mineHit{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(.94);
    }

    100%{
        transform:scale(1);
    }
}

/* map animation */

.map-hit{
    animation:
        mapHit .22s ease;
}

@keyframes mapHit{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.08);
    }

    100%{
        transform:scale(1);
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">
        ؋
    </div>

    <div class="title">
        Afghani Coin
    </div>

    <div class="subtitle">
        Mine AFC and build your balance
    </div>

    <div
        class="balance"
        id="balance">
        0
    </div>

    <div class="coin-name">
        AFC
    </div>

    <div class="stats">

        <div class="stat">

            <div class="stat-name">
                LEVEL
            </div>

            <div
                class="stat-value"
                id="level">
                1
            </div>

        </div>

        <div class="stat">

            <div class="stat-name">
                POWER
            </div>

            <div
                class="stat-value"
                id="power">
                1
            </div>

        </div>

    </div>

    <!-- =========================
         MINE BUTTON
    ========================== -->

    <div class="mine-area">

        <button
            id="mineButton"
            class="mine-button"
            onclick="mine()">

            <!-- Afghanistan map -->
            <svg
                id="afghanistanMap"
                class="afghanistan"
                viewBox="0 0 220 220"
                xmlns="http://www.w3.org/2000/svg">

                <defs>

                    <!-- Three-color Afghanistan -->
                    <clipPath id="afghanClip">

                        <!-- stylized Afghanistan geographic silhouette -->
                        <path
                            d="
                            M42 28
                            L62 18
                            L83 25
                            L101 18
                            L119 28
                            L137 23
                            L157 37
                            L174 39
                            L180 55
                            L193 67
                            L181 79
                            L187 94
                            L176 106
                            L181 120
                            L168 130
                            L166 148
                            L151 153
                            L144 170
                            L126 169
                            L114 181
                            L97 176
                            L82 187
                            L68 177
                            L51 181
                            L44 166
                            L30 158
                            L36 143
                            L25 131
                            L33 116
                            L25 102
                            L37 91
                            L31 76
                            L43 65
                            L37 49
                            Z
                            "
                        />

                    </clipPath>

                    <linearGradient
                        id="blackRedGreen"
                        x1="0"
                        y1="0"
                        x2="1"
                        y2="0">

                        <stop
                            offset="0%"
                            stop-color="#111111"/>

                        <stop
                            offset="33.33%"
                            stop-color="#111111"/>

                        <stop
                            offset="33.34%"
                            stop-color="#c8102e"/>

                        <stop
                            offset="66.66%"
                            stop-color="#c8102e"/>

                        <stop
                            offset="66.67%"
                            stop-color="#007a3d"/>

                        <stop
                            offset="100%"
                            stop-color="#007a3d"/>

                    </linearGradient>

                    <filter
                        id="mapShadow"
                        x="-30%"
                        y="-30%"
                        width="160%"
                        height="160%">

                        <feDropShadow
                            dx="0"
                            dy="5"
                            stdDeviation="4"
                            flood-opacity=".55"/>

                    </filter>

                </defs>

                <!-- Afghan map -->
                <g
                    clip-path="url(#afghanClip)"
                    filter="url(#mapShadow)">

                    <rect
                        x="20"
                        y="15"
                        width="180"
                        height="180"
                        fill="url(#blackRedGreen)"/>

                    <!-- subtle shine -->
                    <ellipse
                        cx="105"
                        cy="55"
                        rx="65"
                        ry="20"
                        fill="white"
                        opacity=".10"/>

                </g>

                <!-- map border -->
                <path
                    d="
                    M42 28
                    L62 18
                    L83 25
                    L101 18
                    L119 28
                    L137 23
                    L157 37
                    L174 39
                    L180 55
                    L193 67
                    L181 79
                    L187 94
                    L176 106
                    L181 120
                    L168 130
                    L166 148
                    L151 153
                    L144 170
                    L126 169
                    L114 181
                    L97 176
                    L82 187
                    L68 177
                    L51 181
                    L44 166
                    L30 158
                    L36 143
                    L25 131
                    L33 116
                    L25 102
                    L37 91
                    L31 76
                    L43 65
                    L37 49
                    Z
                    "
                    fill="none"
                    stroke="#ffd700"
                    stroke-width="4"
                    stroke-linejoin="round"/>

                <!-- small central emblem -->
                <circle
                    cx="108"
                    cy="103"
                    r="12"
                    fill="#ffd700"
                    opacity=".9"/>

                <text
                    x="108"
                    y="109"
                    text-anchor="middle"
                    font-size="13"
                    font-weight="bold"
                    fill="#07111f">
                    ؋
                </text>

            </svg>

            <div class="mine-shine"></div>

        </button>

    </div>

    <!-- ENERGY -->

    <div class="energy-box">

        <div class="energy-text">

            <span>
                ⚡ Energy
            </span>

            <span id="energyText">
                100 / 100
            </span>

        </div>

        <div class="energy-bar">

            <div
                id="energyFill"
                class="energy-fill">
            </div>

        </div>

    </div>

    <!-- BUTTONS -->

    <div class="buttons">

        <button
            class="action"
            onclick="showMessage('Tasks coming soon 🚀')">
            📋 Tasks
        </button>

        <button
            class="action"
            onclick="showMessage('Invite system coming soon 👥')">
            👥 Invite
        </button>

        <button
            class="action"
            onclick="showMessage('Wallet coming soon 💰')">
            💰 Wallet
        </button>

        <button
            class="action upgrade"
            onclick="upgrade()">
            ⬆️ Upgrade
        </button>

    </div>

    <div
        id="status"
        class="status">
        Connecting...
    </div>

</div>

<script>

/* ==================================
   TELEGRAM
================================== */

const tg =
    window.Telegram.WebApp;

tg.ready();
tg.expand();

/* ==================================
   API
================================== */

const API_BASE =
    "https://afghanicoin.vercel.app";

/* ==================================
   TELEGRAM USER
================================== */

let telegramId =
    "123456789";

if(
    tg &&
    tg.initDataUnsafe &&
    tg.initDataUnsafe.user &&
    tg.initDataUnsafe.user.id
){
    telegramId =
        String(
            tg.initDataUnsafe.user.id
        );
}

/* ==================================
   ELEMENTS
================================== */

const balanceEl =
    document.getElementById("balance");

const energyTextEl =
    document.getElementById("energyText");

const energyFillEl =
    document.getElementById("energyFill");

const levelEl =
    document.getElementById("level");

const powerEl =
    document.getElementById("power");

const mineButton =
    document.getElementById("mineButton");

const statusEl =
    document.getElementById("status");

const mapEl =
    document.getElementById("afghanistanMap");

/* ==================================
   USER
================================== */

let user = {

    balance:0,

    energy:100,

    level:1,

    power:1

};

let mining =
    false;

/* ==================================
   STATUS
================================== */

function showMessage(message){

    statusEl.innerText =
        message;

    setTimeout(() => {

        statusEl.innerText =
            "";

    },2500);

}

/* ==================================
   SCREEN
================================== */

function updateScreen(){

    balanceEl.innerText =
        Number(
            user.balance || 0
        );

    energyTextEl.innerText =
        `${Number(user.energy || 0)} / 100`;

    levelEl.innerText =
        Number(
            user.level || 1
        );

    powerEl.innerText =
        Number(
            user.power || 1
        );

    let energy =
        Number(
            user.energy || 0
        );

    energy =
        Math.max(
            0,
            Math.min(100,energy)
        );

    energyFillEl.style.width =
        energy + "%";

    if(energy <= 0){

        mineButton.classList.add(
            "disabled"
        );

    }else{

        mineButton.classList.remove(
            "disabled"
        );

    }

}

/* ==================================
   LOAD USER
================================== */

async function loadUser(){

    try{

        const response =
            await fetch(
                `${API_BASE}/api/user?telegram_id=${encodeURIComponent(telegramId)}`,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }

        const data =
            await response.json();

        if(
            data.success &&
            data.user
        ){

            user =
                data.user;

            updateScreen();

            statusEl.innerText =
                "Connected ✓";

            setTimeout(() => {

                statusEl.innerText =
                    "";

            },1500);

        }else{

            throw new Error(
                data.message ||
                "User error"
            );

        }

    }catch(error){

        console.error(
            "LOAD ERROR:",
            error
        );

        statusEl.innerText =
            "Connection error";

    }

}

/* ==================================
   COIN JUMP
================================== */

function createCoin(){

    const coin =
        document.createElement(
            "div"
        );

    coin.className =
        "coin";

    const amount =
        Number(
            user.power || 1
        );

    coin.innerText =
        "+" + amount + " AFC";

    const rect =
        mineButton.getBoundingClientRect();

    coin.style.left =
        (
            rect.left +
            rect.width / 2 -
            25
        ) + "px";

    coin.style.top =
        (
            rect.top +
            rect.height / 2
        ) + "px";

    const x =
        (
            Math.random() * 100 -
            50
        ) + "px";

    const x2 =
        (
            Math.random() * 160 -
            80
        ) + "px";

    coin.style.setProperty(
        "--x",
        x
    );

    coin.style.setProperty(
        "--x2",
        x2
    );

    document.body.appendChild(
        coin
    );

    setTimeout(() => {

        coin.remove();

    },900);

}

/* ==================================
   SOUND
================================== */

let audioContext = null;

function playMineSound(){

    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if(
            audioContext.state ===
            "suspended"
        ){

            audioContext.resume();

        }

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type =
            "sine";

        oscillator.frequency.setValueAtTime(
            700,
            audioContext.currentTime
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            1200,
            audioContext.currentTime + 0.08
        );

        gain.gain.setValueAtTime(
            0.0001,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.18,
            audioContext.currentTime + 0.01
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            audioContext.currentTime + 0.13
        );

        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime +
            0.14
        );

    }catch(error){

        console.log(
            "Sound error:",
            error
        );

    }

}

/* ==================================
   MINE
================================== */

async function mine(){

    if(mining){

        return;

    }

    if(
        !user ||
        Number(user.energy || 0) <= 0
    ){

        showMessage(
            "⚡ Energy تمام شده است"
        );

        return;

    }

    mining = true;

    /*
    Visual
    */

    mineButton.classList.add(
        "mine-hit"
    );

    mapEl.classList.add(
        "map-hit"
    );

    setTimeout(() => {

        mineButton.classList.remove(
            "mine-hit"
        );

        mapEl.classList.remove(
            "map-hit"
        );

    },220);

    /*
    Sound
    */

    playMineSound();

    /*
    Coin
    */

    createCoin();

    try{

        const response =
            await fetch(
                `${API_BASE}/api/mine`,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        telegram_id:
                            telegramId

                    })
                }
            );

        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }

        const data =
            await response.json();

        console.log(
            "MINE:",
            data
        );

        if(
            data.success &&
            data.user
        ){

            user =
                data.user;

            updateScreen();

        }else{

            throw new Error(
                data.message ||
                "Mining failed"
            );

        }

    }catch(error){

        console.error(
            "MINE ERROR:",
            error
        );

        showMessage(
            "خطا در استخراج"
        );

    }finally{

        mining = false;

    }

}

/* ==================================
   UPGRADE
================================== */

async function upgrade(){

    try{

        const response =
            await fetch(
                `${API_BASE}/api/upgrade`,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        telegram_id:
                            telegramId

                    })
                }
            );

        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }

        const data =
            await response.json();

        if(
            data.success &&
            data.user
        ){

            user =
                data.user;

            updateScreen();

            showMessage(
                "Upgrade successful 🚀"
            );

        }else{

            showMessage(
                data.message ||
                "Upgrade failed"
            );

        }

    }catch(error){

        console.error(
            "UPGRADE ERROR:",
            error
        );

        showMessage(
            "خطا در Upgrade"
        );

    }

}

/* ==================================
   START
================================== */

loadUser();

/* ==================================
   AUTO REFRESH
================================== */

setInterval(() => {

    if(!mining){

        loadUser();

    }

},10000);

</script>

</body>
    </html>
