<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Afghani Coin</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  background:#10151c;
  color:#fff;
  font-family:Arial,sans-serif;
  user-select:none;
  -webkit-user-select:none;
}

.wrap{
  width:100%;
  max-width:430px;
  margin:auto;
  padding:22px 18px 35px;
}

.top{
  text-align:center;
}

.logo{
  width:86px;
  height:86px;
  margin:auto;
  border-radius:50%;
  background:linear-gradient(145deg,#9af078,#42a83e);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:800;
  color:#102014;
}

h1{
  margin:12px 0 4px;
  font-size:27px;
}

.sub{
  color:#91a0b0;
  font-size:14px;
}

.card{
  background:#1a222c;
  border-radius:22px;
  padding:20px;
  margin-top:20px;
  text-align:center;
}

.balance{
  font-size:42px;
  font-weight:800;
  margin:10px;
}

.rate{
  color:#79d85a;
  font-weight:bold;
}

.energy{
  margin-top:20px;
  text-align:left;
}

.energy-head{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
}

.energy-bar{
  width:100%;
  height:14px;
  background:#303b47;
  border-radius:20px;
  overflow:hidden;
}

.energy-fill{
  height:100%;
  width:100%;
  background:#79d85a;
  border-radius:20px;
  transition:width .15s;
}

.mine{
  width:190px;
  height:190px;
  margin:25px auto;
  border:0;
  border-radius:50%;
  background:linear-gradient(145deg,#8be667,#3a9e39);
  color:#071307;
  font-size:25px;
  font-weight:800;
  display:block;

  cursor:pointer;

  touch-action:manipulation;
  -webkit-touch-callout:none;
}

.mine:active{
  transform:scale(.93);
}

.mine.disabled{
  opacity:.4;
}

.status{
  min-height:25px;
}

.upgrade-box{
  margin-top:20px;
  padding:16px;
  background:#202b36;
  border-radius:18px;
  text-align:left;
}

.upgrade-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:5px;
}

.upgrade-info{
  color:#9eabb8;
  font-size:13px;
  margin-bottom:12px;
}

.upgrade-btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:13px;
  background:#4caf50;
  color:white;
  font-size:16px;
  font-weight:bold;
  touch-action:manipulation;
}

.upgrade-btn:disabled{
  opacity:.45;
}

.reset{
  margin-top:15px;
  padding:12px 25px;
  border:0;
  border-radius:12px;
  background:#273442;
  color:white;
  font-weight:bold;
}

</style>
</head>

<body>

<div class="wrap">

  <div class="top">

    <div class="logo">AC</div>

    <h1>Afghani Coin</h1>

    <div class="sub">
      AFC Mining
    </div>

  </div>


  <div class="card">

    <div class="sub">
      YOUR BALANCE
    </div>

    <div class="balance" id="balance">
      0 AFC
    </div>


    <div class="rate" id="rate">
      👆 1 CLICK = +1 AFC
    </div>


    <div class="energy">

      <div class="energy-head">

        <span>⚡ ENERGY</span>

        <span id="energyText">
          100 / 100
        </span>

      </div>


      <div class="energy-bar">

        <div
          class="energy-fill"
          id="energyFill">
        </div>

      </div>

    </div>


    <button
      type="button"
      class="mine"
      id="mine">

      ⛏️ MINE

    </button>


    <div
      class="sub status"
      id="status">

      Tap MINE to earn AFC

    </div>


    <div class="upgrade-box">

      <div class="upgrade-title">
        🚀 Mining Upgrade
      </div>

      <div
        class="upgrade-info"
        id="upgradeInfo">

        Level 1 • +1 AFC per click

      </div>


      <button
        type="button"
        class="upgrade-btn"
        id="upgradeBtn">

        🚀 Upgrade — 100 AFC

      </button>

    </div>


    <button
      type="button"
      class="reset"
      id="reset">

      🔄 Reset

    </button>

  </div>

</div>


<script>

/* =========================
   TELEGRAM
========================= */

const tg =
  window.Telegram &&
  window.Telegram.WebApp;

if(tg){

  try{
    tg.ready();
    tg.expand();
  }catch(e){}

}


/* =========================
   SETTINGS
========================= */

const MAX_ENERGY = 100;

const REGEN_SECONDS = 3;


/* =========================
   LOAD DATA
========================= */

let balance =
  Number(localStorage.getItem("afc_balance") || 0);

let energy =
  Number(localStorage.getItem("afc_energy") || 100);

let level =
  Number(localStorage.getItem("afc_level") || 1);


/* =========================
   CHECK DATA
========================= */

if(!Number.isFinite(balance)){
  balance = 0;
}

if(!Number.isFinite(energy)){
  energy = 100;
}

if(!Number.isFinite(level)){
  level = 1;
}


energy =
  Math.max(
    0,
    Math.min(MAX_ENERGY,energy)
  );


level =
  Math.max(1,level);


/* =========================
   ELEMENTS
========================= */

const balanceEl =
  document.getElementById("balance");

const energyText =
  document.getElementById("energyText");

const energyFill =
  document.getElementById("energyFill");

const mine =
  document.getElementById("mine");

const status =
  document.getElementById("status");

const reset =
  document.getElementById("reset");

const upgradeBtn =
  document.getElementById("upgradeBtn");

const upgradeInfo =
  document.getElementById("upgradeInfo");

const rate =
  document.getElementById("rate");


/* =========================
   UPGRADE PRICE
========================= */

function upgradePrice(){

  return 100 * Math.pow(5,level - 1);

}


/* =========================
   SAVE
========================= */

function save(){

  localStorage.setItem(
    "afc_balance",
    String(balance)
  );

  localStorage.setItem(
    "afc_energy",
    String(energy)
  );

  localStorage.setItem(
    "afc_level",
    String(level)
  );

}


/* =========================
   DISPLAY
========================= */

function render(){

  balanceEl.textContent =
    balance.toLocaleString() + " AFC";


  energyText.textContent =
    energy + " / " + MAX_ENERGY;


  energyFill.style.width =
    (energy / MAX_ENERGY * 100) + "%";


  rate.textContent =
    "👆 1 CLICK = +" +
    level +
    " AFC";


  upgradeInfo.textContent =
    "Level " +
    level +
    " • +" +
    level +
    " AFC per click";


  upgradeBtn.textContent =
    "🚀 Upgrade — " +
    upgradePrice().toLocaleString() +
    " AFC";


  upgradeBtn.disabled =
    balance < upgradePrice();


  if(energy <= 0){

    mine.classList.add("disabled");

  }else{

    mine.classList.remove("disabled");

  }

}


/* =========================
   MINING
========================= */

function mineAFC(){

  if(energy <= 0){

    status.textContent =
      "⚡ Energy is empty";

    return;

  }


  balance =
    balance + level;


  energy =
    energy - 1;


  save();

  render();


  status.textContent =
    "+" +
    level +
    " AFC 🪙";

}


/* =========================
   TELEGRAM / MOBILE CLICK
========================= */

let miningLock = false;


function minePressed(event){

  if(event){

    event.preventDefault();

  }


  if(miningLock){

    return;

  }


  miningLock = true;


  mineAFC();


  setTimeout(
    function(){

      miningLock = false;

    },
    80
  );

}


/* =========================
   POINTER EVENT
========================= */

mine.addEventListener(
  "pointerdown",
  minePressed,
  {
    passive:false
  }
);


/* =========================
   NORMAL CLICK FALLBACK
========================= */

mine.addEventListener(
  "click",
  function(event){

    event.preventDefault();

  }
);


/* =========================
   UPGRADE
========================= */

upgradeBtn.addEventListener(
  "click",
  function(){

    const price =
      upgradePrice();


    if(balance < price){

      status.textContent =
        "❌ Not enough AFC";

      return;

    }


    balance =
      balance - price;


    level =
      level + 1;


    save();

    render();


    status.textContent =
      "🚀 Upgrade purchased! Level " +
      level;

  }
);


/* =========================
   ENERGY REGENERATION
========================= */

setInterval(
  function(){

    if(energy < MAX_ENERGY){

      energy =
        energy + 1;


      save();

      render();

    }

  },
  REGEN_SECONDS * 1000
);


/* =========================
   RESET
========================= */

reset.addEventListener(
  "click",
  function(){

    balance = 0;

    energy = MAX_ENERGY;

    level = 1;


    save();

    render();


    status.textContent =
      "Balance, Energy and Upgrade reset";

  }
);


/* =========================
   START
========================= */

save();

render();

</script>

</body>
</html>
