<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Afghani Coin</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#07111f,#102b45,#07111f);
  color:white;
  text-align:center;
  min-height:100vh;
}

.container{
  max-width:500px;
  margin:auto;
  padding:20px;
}

.logo{
  font-size:60px;
  margin-top:10px;
}

h1{
  margin:5px 0;
  font-size:30px;
}

.subtitle{
  color:#aebdca;
  margin-bottom:20px;
}

.card{
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:20px;
  padding:20px;
  margin-bottom:15px;
  backdrop-filter:blur(10px);
}

.balance-title{
  color:#b9c7d5;
  font-size:15px;
}

.balance{
  font-size:42px;
  font-weight:bold;
  margin:8px 0;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stat{
  background:rgba(0,0,0,0.2);
  padding:15px;
  border-radius:15px;
}

.stat-title{
  color:#aebdca;
  font-size:13px;
}

.stat-value{
  font-size:22px;
  font-weight:bold;
  margin-top:5px;
}

.mine-button{
  width:180px;
  height:180px;
  border-radius:50%;
  border:none;
  background:linear-gradient(135deg,#f5c542,#d89d00);
  color:#111;
  font-size:25px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 10px 35px rgba(0,0,0,.4);
  margin:15px auto;
  display:block;
}

.mine-button:active{
  transform:scale(.94);
}

.mine-button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.energy-bar{
  width:100%;
  height:14px;
  background:rgba(255,255,255,.12);
  border-radius:20px;
  overflow:hidden;
  margin-top:10px;
}

.energy-fill{
  height:100%;
  width:100%;
  background:#f5c542;
  transition:.3s;
}

.energy-text{
  margin-top:8px;
  color:#cbd6df;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.action{
  border:none;
  border-radius:15px;
  padding:16px 10px;
  font-size:16px;
  font-weight:bold;
  color:white;
  cursor:pointer;
}

.upgrade{
  background:#245d9c;
}

.daily{
  background:#7a4ca8;
}

.invite{
  background:#23845b;
}

.leaderboard{
  background:#9b6a1f;
}

.reset{
  background:#743b3b;
}

.action:active{
  transform:scale(.97);
}

.message{
  min-height:25px;
  margin:12px 0;
  color:#f5c542;
  white-space:pre-line;
}

.info{
  color:#b8c5d0;
  line-height:1.8;
  font-size:14px;
}

.loading{
  color:#f5c542;
}

</style>

</head>


<body>

<div class="container">

  <div class="logo">🪙</div>

  <h1>Afghani Coin</h1>

  <div class="subtitle">
    سیستم استخراج آزمایشی AFC
  </div>


  <!-- BALANCE -->

  <div class="card">

    <div class="balance-title">
      موجودی شما
    </div>

    <div class="balance" id="balance">
      0 AFC
    </div
