body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#06111f,#0d2942,#06111f);
  color:white;
  direction:rtl;
  min-height:100vh;
}

.container{

.header{

}

.header h1{

.version{

.card{
  background:rgba(255,255,255,.08);

.energy-bar{

  height:12px;
  background:#263646;
  border-radius:20px;
  overflow:hidden;
  margin-top:8px;
}

.energy-fill{
  height:100%;
  width:100%;
  background:#ffc107;
  transition:.3s;
}

.mine{
  width:190px;
  height:190px;
  border-radius:50%;
  border:0;

  margin:22px auto;

  font-size:27px;
  font-weight:bold;
  box-shadow:0 12px 40px rgba(255,170,0,.35);
}

.mine:active{
  transform:scale(.94);
}

.mine:disabled{
  background:#555;
  color:#aaa;
  box-shadow:none;
}

.grid{

  grid-template-columns:1fr 1fr;
  gap:12px;
}

.option{

}

.section{

}

.section.active{
  display:block;
}

.section-title{
  font-size:22px;
  font-weight:bold;

}

.back{

}

.invite-box{
  text-align:center;
}

.ref-link{
  background:#071522;

  border-radius:10px;

}

.main-button{
  width:100%;
  padding:15px;

.task-icon{

}

  border-radius:13px;

  text-align:center;
}

.stat-number{
  font-size:23px;
  font-weight:bold;
  margin-top:5px;
}

.message{
