<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Afghani Coin</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:18px;
  background:#071827;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

.logo{
  font-size:55px;
  margin-top:10px;
}

h1{
  margin:5px 0 20px;
}

.card{
  background:#123650;
  border-radius:22px;
  padding:20px;
  margin-bottom:20px;
}

.balance{
  font-size:38px;
  font-weight:bold;
  margin:10px;
}

.energy{
  font-size:18px;
}

.mine{
  width:180px;
  height:180px;
  border-radius:50%;
  border:5px solid #ffd54a;
  background:#ffb300;
  font-size:24px;
  font-weight:bold;
  margin:15px auto 30px;
  display:block;
}

.menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.menu a{
  display:block;
  text-decoration:none;
  border-radius:17px;
  padding:20px 5px;
  background:#16496e;
  color:white;
  font-size:18px;
}

.panel{
  display:none;
  background:#123650;
  border-radius:20px;
  padding:20px;
  margin-top:18px;
}

.panel:target{
  display:block;
}

.panel h2{
  margin-top:0;
}

.panel a{
  display:block;
  text-decoration:none;
  background:#ffb300;
  color:#111;
  padding:15px;
  margin-top:12px;
  border-radius:12px;
  font-weight:bold;
}

.close{
  background:#526579!important;
  color:white!important;
}

.info{
  margin-top:20px;
  color:#b9c7d3;
}
</style>
</head>

<body>

<div class="logo">🪙</div>

<h1>Afghani Coin</h1>

<div class="card">

  <div>💰 موجودی شما</div>

  <div class="balance">
    0 AFC
  </div>

  <div class="energy">
    ⚡ انرژی: 100 / 100
  </div>

</div>

<button class="mine">
  ⛏️<br>
  MINE
</button>

<div class="menu">

  <a href="#invite">
    👥<br>
    Invite
  </a>

  <a href="#tasks">
    🎁<br>
    Tasks
  </a>

  <a href="#upgrade">
    🚀<br>
    Upgrade
  </a>

  <a href="#wallet">
    👛<br>
    Wallet
  </a>

</div>


<!-- INVITE -->

<div id="invite" class="panel">

  <h2>👥 دعوت دوستان</h2>

  <p>
    دوستان خود را به Afghani Coin دعوت کنید.
  </p>

  <p>
    لینک دعوت شما:
  </p>

  <p>
    https://t.me/AfghaniCoinBot
  </p>

  <a href="#">
    بستن
  </a>

</div>
