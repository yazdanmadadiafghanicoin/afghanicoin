<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Afghani Coin</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#07111f,#102b45,#07111f);
  color:white;
  text-align:center;
  min-height:100vh;
}

.container{
  max-width:430px;
  margin:auto;
  padding:20px 15px 40px;
}

h1{
  margin:10px 0 5px;
  font-size:32px;
}

.subtitle{
  color:#aebdcc;
  margin-bottom:20px;
}

.balance-box{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  border-radius:20px;
  padding:20px;
  margin-bottom:15px;
}

.balance{
  font-size:38px;
  font-weight:bold;
  margin:8px 0;
}

.coin{
  color:#ffd54a;
}

.stats{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.stat{
  flex:1;
  background:rgba(255,255,255,.08);
  padding:13px 5px;
  border-radius:15px;
}

.stat-title{
  font-size:12px;
  color:#9eb0c3;
}

.stat-value{
  font-size:19px;
  font-weight:bold;
  margin-top:5px;
}

.mine-button{
  width:190px;
  height:190px;
  border-radius:50%;
  border:none;
  background:linear-gradient(145deg,#ffd84d,#ff9d00);
  box-shadow:0 10px 35px rgba(255,170,0,.35);
  font-size:30px;
  font-weight:bold;
  color:#202020;
  cursor:pointer;
  margin:15px 0;
}

.mine-button:active{
  transform:scale(.94);
}

.energy-bar{
  height:15px;
  background:#26384b;
  border-radius:20px;
  overflow:hidden;
  margin:8px 0 20px;
}

.energy-fill{
  height:100%;
  width:100%;
  background:#36d67a;
  transition:.3s;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

button.action{
  border:0;
  padding:15px 8px;
  border-radius:14px;
  font-size:15px;
  font-weight:bold;
  color:white;
  cursor:pointer;
  background:#17466c;
}

button.action:active{
  transform:scale(.97);
}

.upgrade{
  background:#6b45a8 !important;
}

.daily{
  background:#16804e !important;
}

.invite{
  background:#1478b8 !important;
}

.reset{
  background:#8d3030 !important;
}

.section{
  margin-top:18px;
  background:rgba(255,255,255,.07);
  border-radius:18px;
  padding:16px;
}

.section-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:12px;
}

.invite-link{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#0c1724;
  color:white;
  text-align:center;
  margin-bottom:10px;
}

.leaderboard{
  text-align:left;
}

.leader-title{
  text-align:center;
  font-size:21px;
  font-weight:bold;
  margin-bottom:12px;
}

.rank{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(255,255,255,.07);
  padding:11px;
  border-radius:12px;
  margin-bottom:7px;
}

.rank-left{
  display:flex;
  align-items:center;
  gap:9px;
}

.rank-number{
  width:28px;
  font-weight:bold;
}

.rank-name{
  font-weight:bold;
}

.rank-coins{
  color:#ffd54a;
  font-weight:bold;
}

.my-rank{
  margin-top:12px;
  text-align:center;
  color:#9ed8ff;
  font-weight:bold;
}

.message{
  min-height:24px;
  color:#ffd54a;
  font-weight:bold;
  margin:10px 0;
}

.footer{
  margin-top:25px;
  color:#667b90;
  font-size:12px;
}
</style>
</head>

<body>

<div class="container">

<h1>🪙 Afghani Coin</h1>
<div class="subtitle">Mine • Upgrade • Earn</div>

<div class="balance-box">
  <div>YOUR BALANCE</div>
  <div class="balance">
    <span id="balance">0</span>
    <span class="coin"> AFC</span>
  </div>
  <div>⛏️ Mining Power: <span id="power">1</span></div>
</div>

<div class="stats">

  <div class="stat">
    <div class="stat-title">⚡ ENERGY</div>
    <div class="stat-value">
      <span id="energy">100</span>/100
    </div>
  </div>
