<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Afghani Coin</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#10151c;
  color:white;
  font-family:Arial,sans-serif;
}

.wrap{
  max-width:430px;
  margin:auto;
  padding:22px 18px 35px;
}

.top{text-align:center}

.logo{
  width:86px;
  height:86px;
  border-radius:50%;
  margin:auto;
  background:linear-gradient(145deg,#9af078,#42a83e);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:800;
  color:#102014;
}

h1{
  margin:12px 0 4px;
  font-size:27px;
}

.sub{
  color:#91a0b0;
  font-size:14px;
}

.card{
  background:#1a222c;
  border-radius:22px;
  padding:20px;
  margin-top:20px;
  text-align:center;
}

.balance{
  font-size:42px;
  font-weight:800;
  margin:10px;
}

.rate{
  color:#79d85a;
  margin-bottom:15px;
  font-weight:bold;
}

.energy{
  margin:15px 0;
  text-align:left;
}

.energy-head{
  display:flex;
  justify-content:space-between;
  margin-bottom:7px;
}

.energy-bar{
  height:14px;
  background:#303b47;
  border-radius:20px;
  overflow:hidden;
}

.energy-fill{
  height:100%;
  width:100%;
  background:#79d85a;
  transition:width .2s;
}

.mine{
  width:190px;
  height:190px;
  border-radius:50%;
  border:0;
  margin:20px auto;
  background:linear-gradient(145deg,#8be667,#3a9e39);
  color:#071307;
  font-size:24px;
  font-weight:800;
  display:block;
  box-shadow:0 12px 35px #0008;
}

.mine:active{
  transform:scale(.94);
}

.mine:disabled{
  opacity:.4;
}

.status{
  min-height:20px;
}

.row{
  display:flex;
  gap:10px;
  margin-top:14px;
}

.btn{
  flex:1;
  padding:14px;
  border:0;
  border-radius:13px;
  background:#273442;
  color:white;
  font-weight:bold;
}

.note{
  font-size:12px;
  color:#7f8b98;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="top">

    <div class="logo">AC</div>

    <h1>Afghani Coin</h1>

    <div class="sub">
      AFC Mining
    </div>

  </div>

  <div class="card">

    <div class="sub">
      YOUR BALANCE
    </div>

    <div class="balance" id="balance">
      0 AFC
    </div>

    <div class="rate">
      👆 1 CLICK = +1 AFC
    </div>

    <!-- ENERGY -->

    <div class="energy">

      <div class="energy-head">

        <span>⚡ ENERGY</span>

        <span id="energyText">
          100 / 100
        </span>

      </div>

      <div class="energy-bar">

        <div
          class="energy-fill"
          id="energyFill">
        </div>

      </div>

    </div>

    <!-- MINE BUTTON -->

    <button
      class="mine"
      id="mine">

      ⛏️ MINE

    </button>

    <div
      id="status"
      class="sub status">
